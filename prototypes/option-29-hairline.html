<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AB · Hairline fence</title>
<style>
:root{
--accent:#068ef1;--accent-emph:#006fce;--accent-muted:#dfeeff;--accent-subtle:#eff7ff;--accent-bd:#b8dfff;
--bg:#fff;--mist:#fafafa;--faint:#f4f4f5;--subtle:#e4e4e7;
--fg:#18181b;--muted:#71717b;--bd:#e4e4e7;--bd-emph:#d4d4d8;
--pos:#148d74;--pos-bg:#eefaf6;--warn:#a65f00;--warn-bg:#fdf6e7;--paper:#fffcf0;--paper-bd:#ece0bd;
--r-xs:.25rem;--r-sm:.5rem;--r-md:.75rem;--r-lg:1rem;
--s-2xs:.25rem;--s-xs:.5rem;--s-sm:.75rem;--s-md:1rem;--s-lg:1.25rem;--s-xl:1.5rem;--s-2xl:2rem;--s-3xl:2.5rem;
--t-2xs:.69rem;--t-xs:.81rem;--t-sm:.94rem;--t-base:1rem;--t-lg:1.13rem;
--sans:Figtree,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;
--mono:"Reddit Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--fg);background:var(--bg);font-size:var(--t-base);-webkit-font-smoothing:antialiased}
.proto{background:var(--fg);color:#fff;padding:var(--s-xs) var(--s-md);display:flex;gap:var(--s-md);align-items:baseline;font-size:var(--t-xs)}
.proto b{font-size:var(--t-sm);white-space:nowrap}.proto span{color:#a1a1aa}
.app{display:grid;grid-template-columns:3.25rem 1fr 17rem 19rem;height:calc(100vh - 33px);overflow:hidden}
.app>*{min-height:0}
.rail{border-right:1px solid var(--bd);display:flex;flex-direction:column;align-items:center;gap:var(--s-xs);padding:var(--s-sm) 0;background:var(--mist)}
.rail button{width:2.1rem;height:2.1rem;border-radius:var(--r-sm);border:0;background:transparent;cursor:pointer;font-size:var(--t-base);line-height:1;color:var(--muted)}
.rail button:hover{background:var(--faint);color:var(--fg)}
.rail .sep{width:1.5rem;height:1px;background:var(--bd);margin:var(--s-2xs) 0}
.mid{display:flex;flex-direction:column;min-height:0}
.thread-hd{display:flex;align-items:center;gap:var(--s-xs);padding:var(--s-xs) var(--s-md);border-bottom:1px solid var(--bd);flex:none}
.thread-hd .t{font-size:var(--t-sm);font-weight:500;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.thread-hd .n{font-family:var(--mono);font-size:var(--t-2xs);color:var(--muted)}
.thread{flex:1;overflow-y:auto;padding:var(--s-lg) var(--s-2xl) var(--s-2xl);scroll-behavior:smooth;position:relative}
.turn{padding-top:var(--s-lg);scroll-margin-top:2rem;position:relative}
.q{background:var(--accent-subtle);border-radius:var(--r-md);padding:var(--s-sm) var(--s-md);font-size:var(--t-sm);max-width:25rem;margin-left:auto}
.funnel{font-family:var(--mono);font-size:var(--t-2xs);color:var(--muted);margin:var(--s-md) 0 var(--s-sm)}
.aTitle{font-size:var(--t-lg);margin-bottom:var(--s-sm);letter-spacing:-.01em;font-weight:600}
.ans p{font-size:var(--t-sm);line-height:1.7;margin-bottom:var(--s-md);max-width:38rem}
.cite{font-family:var(--mono);font-size:var(--t-2xs);background:var(--faint);border-radius:var(--r-xs);padding:1px 5px}
.ask{border-top:1px solid var(--bd);padding:var(--s-sm) var(--s-2xl);background:var(--mist);flex:none}
.ask .box{background:var(--bg);border:1px solid var(--bd);border-radius:var(--r-md);padding:var(--s-xs) var(--s-sm);max-width:38rem}
.ask .line{display:flex;gap:var(--s-xs);align-items:center}
.ask input{flex:1;border:0;outline:0;font-family:inherit;font-size:var(--t-sm);background:transparent}
.ask input::placeholder{color:var(--muted)}
.send{font-family:inherit;font-size:var(--t-2xs);border:0;background:var(--accent);color:#fff;border-radius:var(--r-sm);padding:6px var(--s-sm);cursor:pointer}
.send:hover{background:var(--accent-emph)}
.hintline{font-family:var(--mono);font-size:var(--t-2xs);color:var(--muted);margin-top:var(--s-2xs);max-width:40rem;line-height:1.6}
.pane{display:flex;flex-direction:column;min-height:0;overflow:hidden;position:relative;border-left:1px solid var(--bd)}
.pane-hd{padding:var(--s-sm) var(--s-md);border-bottom:1px solid var(--bd);flex:none;display:flex;align-items:baseline;gap:var(--s-xs)}
.pane-hd b{font-size:var(--t-sm)}
.pane-hd .c{font-family:var(--mono);font-size:var(--t-2xs);color:var(--muted);margin-left:auto}
.pane-hd .sub{font-family:var(--mono);font-size:var(--t-2xs);color:var(--accent-emph)}
#notesPane{background:var(--paper);border-color:var(--paper-bd)}
#notesPane .pane-hd{border-color:var(--paper-bd)}
.pbody{flex:1;overflow-y:auto;min-height:0;padding:var(--s-xs)}
.card{background:#fff;border:1px solid var(--paper-bd);border-radius:var(--r-md);padding:var(--s-xs) var(--s-sm);margin-bottom:var(--s-xs);box-shadow:0 1px 2px #0000000a}
.card.land{animation:land .4s cubic-bezier(.2,.9,.3,1)}
@keyframes land{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
.card p{font-size:var(--t-xs);line-height:1.5}
.card .pins{display:flex;flex-direction:column;gap:2px;margin-top:var(--s-xs)}
.card .pin{font-size:var(--t-2xs);background:var(--faint);border-radius:var(--r-xs);padding:2px var(--s-2xs);display:flex;gap:var(--s-2xs)}
.card .pin b{font-weight:500;white-space:nowrap}
.card .pin span{color:var(--muted);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.emptyn{font-family:var(--mono);font-size:var(--t-2xs);color:var(--muted);padding:var(--s-md) var(--s-xs);line-height:1.8;text-align:center}
.src{border:1px solid var(--bd);border-radius:var(--r-md);padding:var(--s-sm);margin-bottom:var(--s-xs);background:var(--bg);cursor:pointer;display:flex;gap:var(--s-xs);align-items:flex-start}
.src:hover{border-color:var(--bd-emph)}
.src.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--accent-subtle)}
.src.out{opacity:.32}
.chk{flex:none;width:.8rem;height:.8rem;border:1px solid var(--bd-emph);border-radius:625rem;margin-top:.2rem;background:#fff}
.src.sel .chk{background:var(--accent);border-color:var(--accent);box-shadow:inset 0 0 0 2px #fff}
.src h3{font-size:var(--t-xs);font-weight:500;line-height:1.35}
.src .m{font-family:var(--mono);font-size:var(--t-2xs);color:var(--muted);margin-top:var(--s-2xs)}
.src .p{font-family:var(--mono);font-size:var(--t-2xs);color:var(--muted);margin-top:var(--s-xs)}
.dots{letter-spacing:-1px;color:var(--accent)}.dots i{color:var(--subtle);font-style:normal}
.bar{position:absolute;left:var(--s-xs);right:var(--s-xs);bottom:var(--s-xs);z-index:20;background:var(--fg);color:#fff;
  border-radius:var(--r-md);padding:var(--s-xs);box-shadow:0 10px 28px #0000003d;display:flex;flex-direction:column;gap:var(--s-xs);
  opacity:0;transform:translateY(120%);transition:opacity .18s,transform .22s cubic-bezier(.2,.9,.3,1);pointer-events:none}
.bar.on{opacity:1;transform:none;pointer-events:auto}
.bar .cnt{font-family:var(--mono);font-size:var(--t-2xs);color:#ffffffb3;display:flex;gap:var(--s-2xs)}
.bar .cnt .clr{margin-left:auto;color:#fff;cursor:pointer;text-decoration:underline}
.bar button{font-family:inherit;font-size:var(--t-2xs);background:var(--accent);border:0;color:#fff;border-radius:var(--r-xs);padding:5px var(--s-xs);cursor:pointer}
.bar button:hover{background:var(--accent-emph)}
.toast{position:fixed;left:50%;bottom:1.25rem;transform:translate(-50%,180%);z-index:60;background:var(--fg);color:#fff;
  border-radius:625rem;padding:var(--s-xs) var(--s-md);font-size:var(--t-xs);box-shadow:0 10px 28px #00000040;
  transition:transform .22s cubic-bezier(.2,.9,.3,1);white-space:nowrap}
.toast.on{transform:translate(-50%,0)}

.fence{display:flex;align-items:center;gap:var(--s-sm);margin:var(--s-2xl) 0 0;padding-top:var(--s-xs);
  border-top:1px solid var(--accent-bd);max-width:38rem}
.fence .lbl{font-family:var(--mono);font-size:var(--t-2xs);color:var(--accent-emph);white-space:nowrap}
.fence .out{margin-left:auto;font-family:var(--mono);font-size:var(--t-2xs);color:var(--muted);
  background:none;border:0;cursor:pointer;opacity:0;transition:opacity .14s}
.fence:hover .out,.fence .out:focus{opacity:1}
.fence .out:hover{color:var(--accent-emph);text-decoration:underline}

</style>
</head>
<body>
<div class="proto"><b>AB · Hairline</b><span>A 1px rule and four words in mono. The lightest thing that can still be read as a boundary. Eject appears on hover, so the resting state is almost nothing.</span></div>
<div class="app">
  <nav class="rail">
    <button title="New thread">＋</button><button title="Home">⌂</button>
    <button title="My Library">🔖</button><button title="History">⟲</button>
    <div class="sep"></div><button title="Paper search">🔍</button><button title="Citation Graph">⁂</button>
  </nav>
  <div class="mid">
    <div class="thread-hd"><span class="t">CRISPR Off Target Effects</span><span class="n" id="hdState"></span></div>
    <main class="thread" id="thread"><div id="turns"></div></main>
    <div class="ask" id="ask">
      <div class="box"><div class="line">
        <input placeholder="Ask a follow-up…" id="askInput">
        <button class="send" id="sendBtn">Ask ↩</button>
      </div></div>
      <div class="hintline" id="hint"></div>
    </div>
  </div>
  <aside class="pane" id="notesPane">
    <div class="pane-hd"><b>🗒 Note</b><span class="c" id="noteCnt">0</span></div>
    <div class="pbody" id="note"></div>
  </aside>
  <aside class="pane">
    <div class="pane-hd"><b>References</b><span class="c" id="refCnt"></span></div>
    <div style="padding:var(--s-2xs) var(--s-md) var(--s-xs);flex:none"><span class="sub" id="refSub"></span></div>
    <div class="pbody" id="refs"></div>
    <div class="bar" id="bar">
      <div class="cnt"><span id="barCnt">0 selected</span><span class="clr" id="barClr">clear</span></div>
      <button id="barAdd"></button>
    </div>
  </aside>
</div>
<div class="toast" id="toast"></div>
<script>
const P=[
 {n:"Wienert 2022",t:"CRISPR nuclease off-target activity and mitigation strategies",m:"2022 · 46 cites · Frontiers in Genome Editing",
  k:["mitigat","guide","fidelity","off-target","nuclease","strateg","overview","open question"]},
 {n:"Höijer 2021",t:"CRISPR-Cas9 induces large structural variants at on- and off-target sites",m:"2021 · 149 cites · Nature Communications",
  k:["long-read","structural","variant","deletion","large","detect","assay","indel","sequenc"]},
 {n:"Cancellieri 2022",t:"Human genetic diversity alters off-target outcomes of therapeutic gene editing",m:"2022 · 98 cites · Nature Genetics",
  k:["diversity","population","genetic","variation","individual","ancestry","reference genome","risk"]},
 {n:"Kalter 2025",t:"Off-target effects in CRISPR-Cas genome editing for human therapeutics",m:"2025 · 56 cites · Molecular Therapy Nucleic Acids",
  k:["detect","therapeut","standard","method","survey","clinical","human","off-target"]},
 {n:"Angelini Stewart 2025",t:"Measurement and clinical interpretation of CRISPR off-targets",m:"2025 · 6 cites · Nature Genetics",
  k:["clinical","monitor","interpret","measure","patient","follow-up","after","regulat"]},
 {n:"Huang 2022",t:"In vivo delivery of CRISPR-Cas9 genome editing components",m:"2022 · 39 cites · Biomaterials",
  k:["deliver","vivo","lnp","nanoparticle","lipid","viral","aav","tropism","liver","vector"]}
];
const REAL={q:"What are the open questions in CRISPR off-target effects for in vivo therapies?",
 title:"Open Questions in CRISPR Off-Target Effects for In Vivo Therapies",
 funnel:"32.8M retrieved · 100 eligible · 20 included",
 refs:[{p:0,rank:1},{p:1,rank:2},{p:3,rank:3},{p:2,rank:4},{p:4,rank:9},{p:5,rank:12}],
 paras:["Several unresolved questions persist across detection, biological variability, structural variants, and clinical monitoring [[0]] [[3]].",
  "Large-scale aberrations remain far harder to detect than small indels using current workflows [[1]].",
  "Human genetic diversity is an under-explored confound [[2]].",
  "There is no consensus on post-delivery monitoring [[4]].",
  "Delivery remains the rate-limiting step for in vivo work [[5]]."]};
const SEED=[
 {q:"How do long-read methods detect structural variants that short-read assays miss?",
  title:"Long-read detection of structural variants",cites:[1,3],
  paras:["Long-read sequencing recovers large deletions and rearrangements that indel-focused short-read workflows systematically miss [[1]].",
   "Surveys of therapeutic detection methods place long-read approaches outside the current standard set [[3]]."]},
 {q:"Do detection standards agree on what counts as an off-target?",
  title:"Whether detection standards agree",cites:[3,4,0],
  paras:["They do not. Current standards disagree on what counts as detected, which makes cross-study comparison unreliable [[3]].",
   "A framework for clinical interpretation sits above the measurement layer, but assumes the measurement is settled [[4]].",
   "The mitigation literature treats the same disagreement as a guide-design problem [[0]]."]},
 {q:"Which guide design changes reduce off-target activity the most?",
  title:"Guide design and mitigation",cites:[0,3],
  paras:["High-fidelity nuclease variants and guide redesign are the two mitigations with the most support behind them [[0]].",
   "For therapeutic use, mitigation is judged against detection methods that themselves do not agree [[3]]."]},
 {q:"Does human genetic diversity change off-target risk for an individual patient?",
  title:"Genetic diversity and individual risk",cites:[2,3,4],
  paras:["Yes. Individual variation changes the off-target landscape, so a reference-genome analysis under-reports risk [[2]].",
   "Therapeutic detection surveys do not currently build this in [[3]].",
   "The clinical framework treats it as a per-patient input rather than a population correction [[4]]."]},
 {q:"What should be monitored in a patient after in vivo delivery?",
  title:"Post-delivery monitoring",cites:[4,5],
  paras:["There is no consensus. The clearest proposal is a framework for interpreting off-target measurements clinically [[4]].",
   "What can be monitored depends on where the editor went, and that is set by the delivery vehicle [[5]]."]},
 {q:"How does vector choice constrain which tissue is edited in vivo?",
  title:"Vector choice and tissue tropism",cites:[5,4],
  paras:["Viral and lipid nanoparticle delivery impose different tropism constraints, so the vehicle decides which tissue is exposed [[5]].",
   "That puts monitoring downstream of delivery rather than parallel to it [[4]]."]},
 {q:"Is a reference genome analysis enough for a clinical trial population?",
  title:"Reference genome versus trial population",cites:[2,3,4],
  paras:["Ancestry changes the answer. A reference-genome analysis under-reports risk across a diverse population [[2]].",
   "Neither the detection surveys [[3]] nor the clinical framework [[4]] require a population-matched analysis."]}
];
const $=id=>document.getElementById(id);
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');
  clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2800)}
function score(text,pool){
  const q=text.toLowerCase();
  return (pool||P.map((_,i)=>i)).map(i=>({i,s:P[i].k.reduce((a,k)=>a+(q.includes(k)?3:0),0)
    +P[i].t.toLowerCase().split(/\W+/).filter(w=>w.length>4&&q.includes(w)).length}));
}
function derive(text,cites,pool){
  const keep=score(text,pool).filter(x=>x.s>0||(cites||[]).includes(x.i));
  keep.sort((a,b)=>b.s-a.s||a.i-b.i);
  return (keep.length?keep:score(text,pool)).map((x,k)=>({p:x.i,rank:k+1}));
}
const mkTurn=s=>{const refs=derive(s.q,s.cites,null);
  return {q:s.q,title:s.title,refs,paras:s.paras.slice(),
   funnel:'keyword-matched over 6 captured papers · '+refs.length+' included',fenced:false}};
let TURNS=[REAL].concat(SEED.map(mkTurn));
/* the fence: from this turn index down, retrieval is limited to these sources */
let FENCE=null, CARDS=[], selSrc=new Set();

const inFence=i=>!!FENCE&&i>=FENCE.from;
const fenceSrcs=()=>FENCE?FENCE.srcs:null;
function visibleSrcs(){
  if(!FENCE) {
    const hits=new Map();
    TURNS.forEach(t=>t.refs.forEach(r=>{const e=hits.get(r.p)||{p:r.p,n:0,best:99};
      e.n++;e.best=Math.min(e.best,r.rank);hits.set(r.p,e)}));
    return {list:[...hits.values()].sort((a,b)=>b.n-a.n||a.best-b.best),tot:TURNS.length,scoped:false};
  }
  const from=FENCE.from, hits=new Map();
  for(let i=from;i<TURNS.length;i++) TURNS[i].refs.forEach(r=>{
    const e=hits.get(r.p)||{p:r.p,n:0,best:99};e.n++;e.best=Math.min(e.best,r.rank);hits.set(r.p,e)});
  FENCE.srcs.forEach(p=>{if(!hits.has(p)) hits.set(p,{p,n:0,best:99})});
  return {list:[...hits.values()].sort((a,b)=>b.n-a.n||a.best-b.best),tot:TURNS.length-from,scoped:true};
}
function dots(n,tot){const slots=5,f=Math.max(n?1:0,Math.round(n/Math.max(tot,1)*slots));
  return '●'.repeat(Math.min(f,slots))+'○'.repeat(Math.max(0,slots-f))}
function fillCites(h){return h.replace(/\[\[(\d+)\]\]/g,(_,i)=>'<span class="cite">'+P[+i].n.toUpperCase()+'</span>')}

function renderThread(){
  const host=$('turns'); host.innerHTML='';
  TURNS.forEach((t,i)=>{
    if(FENCE&&FENCE.from===i){const f=fenceLine();if(f)host.appendChild(f)}
    // (fence past the last turn is appended after the loop)
    const d=document.createElement('div');
    d.className='turn'+(inFence(i)?' fenced':''); d.dataset.i=i;
    d.innerHTML='<div class="q"></div><div class="funnel"></div><div class="ans"><div class="aTitle"></div></div>';
    d.querySelector('.q').textContent=t.q;
    d.querySelector('.funnel').innerHTML=funnelText(t,i);
    d.querySelector('.aTitle').textContent=t.title;
    t.paras.forEach(p=>{const el=document.createElement('p');el.innerHTML=fillCites(esc(p));
      d.querySelector('.ans').appendChild(el)});
    host.appendChild(d);
  });
  if(FENCE&&FENCE.from>=TURNS.length){const f=fenceLine();if(f)host.appendChild(f)}
  afterRender();
}
function renderRefs(){
  const {list,tot,scoped}=visibleSrcs();
  $('refCnt').textContent=list.length;
  $('refSub').textContent=scoped
    ? 'your '+FENCE.srcs.length+' sources only'
    : 'everything retrieved so far';
  $('refSub').style.color=scoped?'var(--accent-emph)':'var(--muted)';
  const box=$('refs'); box.innerHTML='';
  const all=P.map((_,i)=>i);
  all.forEach(p=>{
    const e=list.find(x=>x.p===p);
    const out=scoped&&!FENCE.srcs.includes(p);
    if(scoped&&out&&!e) { }
    const d=document.createElement('div'); d.className='src'+(selSrc.has(p)?' sel':'')+(out?' out':'');
    d.dataset.p=p;
    d.innerHTML='<span class="chk"></span><div><h3></h3><div class="m"></div><div class="p"></div></div>';
    d.querySelector('h3').textContent=P[p].t;
    d.querySelector('.m').textContent=P[p].n+' · '+P[p].m;
    const n=e?e.n:0;
    /* empty dots next to "nothing asked yet" are decoration pretending to be data */
    d.querySelector('.p').innerHTML = out ? 'outside your scope'
      : tot===0 ? 'in your scope · nothing asked yet'
      : '<span class="dots">'+dots(n,tot)+'</span> '+n+' of '+tot+
        (scoped?' turns since':' turns')+(e&&e.best<99?' · best #'+e.best:'');
    d.addEventListener('click',()=>{selSrc.has(p)?selSrc.delete(p):selSrc.add(p);renderRefs();syncBar()});
    box.appendChild(d);
  });
}
function renderNote(){
  const box=$('note'); box.innerHTML='';
  $('noteCnt').textContent=CARDS.length;
  if(!CARDS.length){box.innerHTML='<div class="emptyn">Select sources on the right,<br>then add them here.</div>';return}
  CARDS.forEach(c=>{
    const d=document.createElement('div'); d.className='card';
    d.innerHTML='<p></p><div class="pins"></div>';
    d.querySelector('p').textContent=c.text;
    c.srcs.forEach(p=>{const r=document.createElement('div');r.className='pin';
      r.innerHTML='<b></b><span></span>';r.querySelector('b').textContent=P[p].n;
      r.querySelector('span').textContent=P[p].m.split(' · ')[1];
      d.querySelector('.pins').appendChild(r)});
    box.appendChild(d);
  });
  box.firstElementChild && box.firstElementChild.classList.add('land');
}
function syncBar(){
  const n=selSrc.size;
  $('barCnt').textContent=n+' selected';
  $('barAdd').textContent='🗒 Add '+n+' to note — and search only these';
  $('bar').classList.toggle('on',n>0);
}
$('barClr').addEventListener('click',()=>{selSrc.clear();renderRefs();syncBar()});
$('barAdd').addEventListener('click',()=>{
  const srcs=[...selSrc].sort((a,b)=>a-b);
  CARDS.unshift({text:'The '+srcs.length+' I am actually working from.',srcs});
  FENCE={from:TURNS.length,srcs};
  selSrc.clear(); renderAll(); onFenceSet();
});
function eject(){
  if(!FENCE) return;
  FENCE=null; renderAll();
  toast('Searching everything again. Your note and every turn are untouched.');
}
function submit(){
  const text=$('askInput').value.trim(); if(!text) return;
  const pool=fenceSrcs();
  const refs=derive(text,[],pool);
  const top=refs.slice(0,3).map(r=>r.p);
  const t={q:text,title:text.charAt(0).toUpperCase()+text.slice(1).replace(/\?+$/,''),refs,
   fenced:!!FENCE,
   funnel:FENCE?('your '+FENCE.srcs.length+' sources · '+refs.length+' used · nothing new retrieved')
              :('keyword-matched over 6 captured papers · '+refs.length+' included'),
   paras:[ 'The strongest evidence here comes from [['+top[0]+']]'+(top[1]!=null?' and [['+top[1]+']]':'')+'.',
     top[2]!=null?'[['+top[2]+']] is the weakest of the three.':'' ].filter(Boolean)};
  TURNS.push(t); $('askInput').value=''; renderAll();
  const el=$('turns').querySelector('[data-i="'+(TURNS.length-1)+'"]');
  if(el) el.scrollIntoView({block:'start'});
}
$('sendBtn').addEventListener('click',submit);
$('askInput').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submit()}});
function renderAll(){renderThread();renderRefs();renderNote();syncBar();syncChrome()}
renderAll();
$('thread').scrollTop=$('thread').scrollHeight;

function fenceLine(){
  const d=document.createElement('div'); d.className='fence';
  d.innerHTML='<span class="lbl"></span><button class="out">searching everything again ↑</button>';
  d.querySelector('.lbl').textContent='↓ from here · '+FENCE.srcs.length+' sources only';
  d.querySelector('.out').addEventListener('click',eject);
  return d;
}
function funnelText(t,i){return esc(t.funnel)}
function afterRender(){}
function syncChrome(){
  $('hdState').textContent=FENCE?'scoped · '+FENCE.srcs.length+' sources':'';
  $('hint').textContent=FENCE
    ? 'Everything below the line is answered from your '+FENCE.srcs.length+' sources. Hover the line to leave.'
    : 'Select sources on the right and add them to the note to narrow what you are searching.';
}
function onFenceSet(){toast('From here down, searching your '+FENCE.srcs.length+' sources only.')}

</script>
