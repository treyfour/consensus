<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notes in Consensus — hi-fi</title>
<style>
/* ══════════════════════════════════════════════════════════════════════════
   CDL — Consensus Design Language, extracted from the live app on 2026-08-04.
   Every colour, radius, spacing and type step below is a real --cdl-* token
   (research/cdl-tokens.css). No invented hex.
   CircularXXWeb is licensed; Figtree is the metric substitute. Reddit Mono
   is the real mono and is named exactly.
   Light theme only — dark was explicitly out of scope for this build.
   ═══════════════════════════════════════════════════════════════════════ */
:root{
  --accent:#068ef1;--accent-emph:#006fce;--accent-muted:#dfeeff;--accent-subtle:#eff7ff;--accent-bd:#b8dfff;
  --bg:#fff;--mist:#fafafa;--faint:#f4f4f5;--subtle:#e4e4e7;--heavy:#27272a;
  --fg:#18181b;--muted:#71717b;--placeholder:#9f9fa9;--bd:#e4e4e7;--bd-emph:#d4d4d8;
  --pos:#148d74;--pos-bg:#cef9eb;--green:#3bcdaa;--warn:#a65f00;--warn-bg:#fef9c2;
  --btn-primary-bd:#00000029;--btn-secondary-bd:#00000014;
  --r-xs:.25rem;--r-sm:.5rem;--r-md:.75rem;--r-lg:1rem;--r-circle:624.94rem;
  --s-3xs:.13rem;--s-2xs:.25rem;--s-xs:.5rem;--s-sm:.75rem;--s-md:1rem;
  --s-lg:1.25rem;--s-xl:1.5rem;--s-2xl:2rem;--s-3xl:2.5rem;
  --t-2xs:.69rem;--t-xs:.81rem;--t-sm:.94rem;--t-base:1rem;--t-lg:1.13rem;
  --h-2xs:1.13rem;--h-xs:1.25rem;--h-sm:1.38rem;--h-base:1.75rem;
  --lh-2xs:1.06rem;--lh-xs:1.22rem;--lh-sm:1.41rem;--lh-base:1.5rem;--lh-lg:1.75rem;
  --w-reg:400;--w-med:500;--w-bold:700;
  --icon-sm:1rem;--icon-md:1.25rem;--icon-lg:1.5rem;
  --elev:0px 6px 12px 0px #35465508;
  --elev-pop:0 1px 2px #18181b0d,0 8px 24px #18181b14;
  --dur:.1s;
  --sans:Figtree,"CircularXXWeb",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"Reddit Mono",ui-monospace,SFMono-Regular,Menlo,Monaco,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--sans);color:var(--fg);background:var(--bg);font-size:var(--t-base);
  -webkit-font-smoothing:antialiased;overflow:hidden}
button,input,textarea{font-family:inherit;color:inherit}
svg{display:block;flex:none}
.app{display:grid;grid-template-columns:13rem 1fr;height:100vh}
.app>*{min-height:0}

/* ── sidebar ─────────────────────────────────────────────────────────────
   Two states, both real: the thread sidebar (screens/03) and the library
   sidebar (screens/09), which replaces Recents/Tools with Collections. */
.sb{border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:var(--s-sm);gap:var(--s-3xs);overflow:hidden}
.sb .brand{display:flex;align-items:center;justify-content:space-between;padding:var(--s-xs) var(--s-2xs) var(--s-md)}
.sb .brand .logo{width:1.5rem;height:1.5rem;border-radius:var(--r-circle);
  background:conic-gradient(from 210deg,#3bcdaa,#068ef1 55%,#3bcdaa);flex:none}
.sb .brand .ic{display:flex;gap:var(--s-2xs)}
.sb .brand button{border:0;background:none;color:var(--muted);cursor:pointer;padding:var(--s-3xs);border-radius:var(--r-xs)}
.sb .brand button:hover{color:var(--fg);background:var(--faint)}
.nav{display:flex;align-items:center;gap:var(--s-sm);width:100%;border:0;background:none;cursor:pointer;
  padding:var(--s-xs) var(--s-xs);border-radius:var(--r-sm);font-size:var(--t-sm);color:var(--fg);text-align:left}
.nav:hover{background:var(--faint)}
.nav.on{background:var(--faint);font-weight:var(--w-med)}
.nav .ring{width:1.5rem;height:1.5rem;border:1px solid var(--bd-emph);border-radius:var(--r-circle);
  display:grid;place-items:center;flex:none}
.nav .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav .ext{color:var(--muted)}
.sb .lab{font-size:var(--t-xs);color:var(--muted);padding:var(--s-md) var(--s-xs) var(--s-2xs)}
.sb .scroll{flex:1;overflow-y:auto;min-height:0}
.sb .recent{font-size:var(--t-xs);color:var(--fg)}
.sb .foot{border-top:1px solid var(--bd);margin-top:var(--s-xs);padding-top:var(--s-xs);display:flex;flex-direction:column;gap:var(--s-3xs)}
.sb .acct{display:flex;align-items:center;gap:var(--s-sm);padding:var(--s-xs)}
.sb .acct .av{width:1.5rem;height:1.5rem;border-radius:var(--r-circle);background:#4f46e5;color:#fff;
  display:grid;place-items:center;font-size:var(--t-2xs);font-weight:var(--w-med);flex:none}
.sb .quota{display:flex;align-items:center;gap:var(--s-xs);font-size:var(--t-xs);color:var(--muted);padding:var(--s-2xs) var(--s-xs)}
.sb .quota .dot{width:.75rem;height:.75rem;border-radius:var(--r-circle);
  background:conic-gradient(var(--warn-bg) 0 27%,var(--subtle) 0);flex:none}
.sb .upg{display:flex;align-items:center;justify-content:center;gap:var(--s-xs);width:100%;height:2.5rem;
  border:1px solid var(--bd);border-radius:var(--r-md);background:var(--bg);font-size:var(--t-sm);
  font-weight:var(--w-med);cursor:pointer;box-shadow:var(--elev)}
.sb .upg:hover{border-color:var(--bd-emph)}
.sb .zot{display:flex;align-items:center;justify-content:center;gap:var(--s-xs);width:100%;height:2.5rem;
  border:1px solid var(--bd);border-radius:var(--r-md);background:var(--bg);font-size:var(--t-sm);
  font-weight:var(--w-med);cursor:pointer;box-shadow:var(--elev);margin-bottom:var(--s-xs)}
.sb .zot b{color:#a52a2a;font-family:var(--mono)}
.collrow{display:flex;align-items:center;gap:var(--s-xs);width:100%;border:0;background:none;cursor:pointer;
  padding:var(--s-xs);border-radius:var(--r-sm);font-size:var(--t-xs);color:var(--fg);text-align:left}
.collrow:hover{background:var(--faint)}
.collrow.on{background:var(--faint);font-weight:var(--w-med)}
.collrow.sub{padding-left:var(--s-xl)}
.collrow .grow{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── stage ───────────────────────────────────────────────────────────── */
.stage{position:relative;overflow:hidden}
.screen{position:absolute;inset:0;display:none}
.screen.on{display:grid}
#threadScreen{grid-template-columns:1fr auto auto}
#threadScreen>*{min-height:0;min-width:0}
.mid{display:flex;flex-direction:column;min-height:0;position:relative}

/* thread header — screens/03 */
.thd{display:flex;align-items:center;gap:var(--s-xs);padding:var(--s-sm) var(--s-lg);flex:none;overflow:hidden}
/* with three columns open the thread gets narrow, so the header sheds its
   labels before it sheds a control — every button stays reachable */
.thd.tight{padding-left:var(--s-md);padding-right:var(--s-md);gap:var(--s-2xs)}
.thd.tight .pill .lb{display:none}
.thd.tight .pill{padding:0 var(--s-xs)}
.thd .ttl{font-size:var(--h-2xs);font-weight:var(--w-bold);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;min-width:3rem}
.thd .cnt{font-size:var(--t-sm);color:var(--muted)}
.thd .sp{flex:1}
.ghostbtn{width:2.25rem;height:2.25rem;display:grid;place-items:center;border:0;background:none;
  border-radius:var(--r-sm);color:var(--fg);cursor:pointer}
.ghostbtn:hover{background:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:var(--s-xs);height:2.5rem;padding:0 var(--s-sm);
  border:1px solid var(--bd);border-radius:var(--r-md);background:var(--bg);font-size:var(--t-sm);
  font-weight:var(--w-med);cursor:pointer;box-shadow:var(--elev);white-space:nowrap;
  transition:transform var(--dur)}
.pill:hover{border-color:var(--bd-emph)}
.pill:active{transform:scale(.98)}
.pill.on{background:var(--accent-subtle);border-color:var(--accent-bd);color:var(--accent-emph)}
.pill.tint{background:var(--accent-subtle);border-color:transparent}
.pill.drop{background:var(--accent-muted);border-color:var(--accent);color:var(--accent-emph)}
.pill.sm{height:2rem;font-size:var(--t-xs);padding:0 var(--s-xs);border-radius:var(--r-sm)}

/* thread body */
.body{flex:1;overflow-y:auto;padding:var(--s-xs) var(--s-lg) 12rem;scroll-behavior:smooth}
.inner{max-width:36rem;margin:0 auto}
.turn{margin-bottom:var(--s-2xl)}
.q{background:var(--accent-muted);border-radius:var(--r-md);padding:var(--s-sm) var(--s-md);
  font-size:var(--t-base);line-height:var(--lh-base);margin-left:auto;width:fit-content;max-width:100%}
.q .att{display:flex;align-items:center;gap:var(--s-2xs);font-family:var(--mono);font-size:var(--t-2xs);
  letter-spacing:.04em;color:var(--accent-emph);margin-bottom:var(--s-2xs)}

/* agent trace — screens/04, 05 */
.trace{margin-top:var(--s-md)}
.trace .hd{display:flex;align-items:center;gap:var(--s-xs);font-size:var(--t-xs);color:var(--muted);
  cursor:pointer;border:0;background:none;padding:var(--s-2xs) 0}
.trace .hd b{color:var(--fg);font-size:var(--t-sm)}
.trace .hd .chev{transition:transform var(--dur)}
.trace.open .hd .chev{transform:rotate(180deg)}
.trace .panel{display:none;padding-left:var(--s-2xs)}
.trace.open .panel{display:block}
.funnel{display:flex;gap:var(--s-3xl);padding:var(--s-sm) 0}
.funnel .cell b{font-size:var(--h-xs);font-weight:var(--w-bold);display:flex;align-items:center;gap:var(--s-2xs)}
.funnel .cell b svg{color:var(--placeholder)}
.funnel .cell span{font-size:var(--t-xs);color:var(--muted)}
.trace hr{border:0;border-top:1px solid var(--bd);margin:0}
.step{display:flex;align-items:center;gap:var(--s-sm);padding:var(--s-xs) 0;font-size:var(--t-sm)}
.step svg:first-child{color:var(--muted)}
.step .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.step .pool{font-weight:var(--w-bold);font-size:var(--t-xs);margin-left:auto;white-space:nowrap}
.step .go{color:var(--muted)}
.step.lit{color:var(--accent-emph)}
.step.lit svg:first-child{color:var(--accent)}
/* the one sentence this whole prototype turns on */
.discard{font-size:var(--t-xs);line-height:var(--lh-xs);color:var(--muted);padding:var(--s-xs) 0 var(--s-2xs);
  border-top:1px solid var(--bd);margin-top:var(--s-2xs)}
.discard b{color:var(--fg);font-weight:var(--w-med)}
.scopeline{display:flex;align-items:center;gap:var(--s-xs);font-size:var(--t-xs);color:var(--muted);
  margin-top:var(--s-md);padding-bottom:var(--s-2xs)}
.scopeline svg{color:var(--accent)}

/* answer */
.ans{margin-top:var(--s-lg)}
.ans h2{font-size:var(--h-sm);line-height:var(--h-base);font-weight:var(--w-bold);margin-bottom:var(--s-sm)}
.ans p{font-size:var(--t-base);line-height:var(--lh-lg);margin-bottom:var(--s-sm)}
.ans h3{font-size:var(--t-lg);font-weight:var(--w-bold);margin:var(--s-lg) 0 var(--s-sm)}
.cite{display:inline-flex;align-items:center;gap:var(--s-3xs);background:var(--faint);border-radius:var(--r-xs);
  padding:0 var(--s-2xs);font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.02em;
  text-transform:uppercase;cursor:grab;vertical-align:baseline;white-space:nowrap}
.cite:hover,.cite.lit{background:var(--accent-muted);color:var(--accent-emph)}
.cite svg{width:.7rem;height:.7rem}
/* evidence coverage table — captured from screens/03 */
.ev{width:100%;border-collapse:collapse;margin-bottom:var(--s-sm);font-size:var(--t-sm)}
.ev th{text-align:left;font-weight:var(--w-med);padding:var(--s-xs) var(--s-sm);vertical-align:bottom;
  border-bottom:1px solid var(--bd)}
.ev td{padding:var(--s-sm);border-bottom:1px solid var(--bd);font-weight:var(--w-med)}
.ev td.h{text-align:center;color:#fff;font-weight:var(--w-bold)}
.ev td.h.lo{background:#a8d8fb;color:var(--fg)}
.ev td.h.mid{background:#5cb6f5;color:var(--fg)}
.ev td.h.hi{background:var(--accent)}
.ev td.h.gap{background:var(--faint);color:var(--muted);font-family:var(--mono);font-size:var(--t-2xs)}

/* composer — screens/03, floats over the thread */
.comp-wrap{position:absolute;left:0;right:0;bottom:0;padding:0 var(--s-lg) var(--s-lg);
  background:linear-gradient(transparent,var(--bg) 22%);pointer-events:none}
.comp{max-width:36rem;margin:0 auto;pointer-events:auto;background:var(--bg);border:1px solid var(--bd);
  border-radius:var(--r-lg);box-shadow:var(--elev-pop);padding:var(--s-sm);transition:border-color var(--dur)}
.comp.over,.comp.dropok{border-color:var(--accent);background:var(--accent-subtle)}
.chipatt{position:relative;display:inline-flex;align-items:flex-start;gap:var(--s-xs);background:var(--faint);
  border-radius:var(--r-sm);padding:var(--s-xs) var(--s-sm);margin-bottom:var(--s-xs);max-width:100%}
.chipatt .tx{min-width:0}
.chipatt b{display:block;font-size:var(--t-xs);font-weight:var(--w-med);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chipatt span{font-size:var(--t-2xs);color:var(--muted)}
.chipatt .x{position:absolute;top:-.4rem;right:-.4rem;width:1.15rem;height:1.15rem;border-radius:var(--r-circle);
  background:var(--heavy);color:#fff;border:0;display:grid;place-items:center;cursor:pointer}
.comp .row1{display:flex;align-items:center;gap:var(--s-xs);padding:var(--s-xs) var(--s-2xs) var(--s-sm)}
.comp input.ask{flex:1;border:0;outline:0;font-size:var(--t-base);background:none}
.comp input.ask::placeholder{color:var(--placeholder)}
.tabhint{font-family:var(--mono);font-size:var(--t-2xs);color:var(--placeholder);white-space:nowrap}
.comp .row2{display:flex;align-items:center;gap:var(--s-xs)}
.circ{width:2.25rem;height:2.25rem;border-radius:var(--r-circle);border:1px solid var(--bd);background:var(--bg);
  display:grid;place-items:center;cursor:pointer;flex:none;transition:transform var(--dur)}
.circ:hover{border-color:var(--bd-emph)}
.circ:active{transform:scale(.98)}
.circ.send{background:var(--accent);border-color:var(--btn-primary-bd);color:#fff}
.circ.send:disabled{opacity:.45;cursor:default}
.circ.ghost{border:0}
.circ.ghost:hover{background:var(--faint)}
.dashed{border-style:dashed;color:var(--muted)}
.dashed .deep{color:var(--accent)}
.comp .grow{flex:1}
#inclNotes{display:none}
#inclNotes.show{display:inline-flex}
#inclNotes.on{background:var(--accent-subtle);border-color:var(--accent-bd);color:var(--accent-emph)}
.thinking{display:flex;align-items:center;gap:var(--s-xs);font-size:var(--t-xs);color:var(--muted);
  margin-top:var(--s-md)}
.thinking i{width:.3rem;height:.3rem;border-radius:var(--r-circle);background:var(--placeholder);
  animation:bl 1s infinite}
.thinking i:nth-child(2){animation-delay:.15s}.thinking i:nth-child(3){animation-delay:.3s}
@keyframes bl{0%,100%{opacity:.25}50%{opacity:1}}
.blank{max-width:36rem;margin:6rem auto 0;text-align:center}
.blank b{display:block;font-size:var(--h-sm);font-weight:var(--w-bold);margin-bottom:var(--s-xs)}
.blank span{font-size:var(--t-sm);color:var(--muted);line-height:var(--lh-sm)}
.blank kbd{font-family:var(--mono);font-size:var(--t-2xs);background:var(--faint);border-radius:var(--r-xs);padding:1px 4px}

/* ── the panels ──────────────────────────────────────────────────────────
   The product's right-hand drawer swaps between References and the Paper
   detail. Notes is a panel of its own, to the LEFT of that drawer, so a
   reference can be dragged straight across into a card without either side
   having to go away. Same frame, same header grammar. */
.drawer{width:25rem;border-left:1px solid var(--bd);display:none;flex-direction:column;min-height:0}
.drawer.on{display:flex}
.notespane{width:20rem;border-left:1px solid var(--bd);display:none;flex-direction:column;min-height:0}
.notespane.on{display:flex}
.notespane .dhd{padding:var(--s-sm) var(--s-xs) var(--s-sm) var(--s-md);gap:var(--s-2xs)}
.notespane .dhd .t{font-size:var(--t-lg)}
.notespane .dswitch{flex:1;min-width:0;max-width:none}
.notespane .dsub,.notespane .chips{padding-left:var(--s-md);padding-right:var(--s-md)}
.notespane .dbody{padding-left:var(--s-md);padding-right:var(--s-md)}
.notespane .ncomp{margin-left:var(--s-md);margin-right:var(--s-md)}
.notespane.over{background:var(--accent-subtle)}
.dhd{display:flex;align-items:center;gap:var(--s-xs);padding:var(--s-sm) var(--s-md) var(--s-sm) var(--s-lg);flex:none}
.dhd .t{font-size:var(--h-2xs);font-weight:var(--w-bold);white-space:nowrap}
.dhd .slash{color:var(--bd-emph)}
.dhd .sp{flex:1}
.dswitch{display:flex;align-items:center;gap:var(--s-xs);border:0;background:none;cursor:pointer;
  font-size:var(--t-sm);color:var(--fg);border-radius:var(--r-sm);padding:var(--s-2xs) var(--s-xs);
  min-width:0;max-width:13rem}
.dswitch:hover{background:var(--faint)}
.dswitch .grow{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dswitch svg{color:var(--muted)}
.xbtn{width:2.25rem;height:2.25rem;border-radius:var(--r-circle);border:1px solid var(--bd);background:var(--bg);
  display:grid;place-items:center;cursor:pointer;flex:none}
.xbtn:hover{border-color:var(--bd-emph)}
.dsub{display:flex;align-items:center;gap:var(--s-xs);padding:var(--s-xs) var(--s-lg) var(--s-sm)}
.dsub .t{font-size:var(--t-base);font-weight:var(--w-bold)}
.dsub .n{font-size:var(--t-sm);color:var(--muted)}
.dsub .sp{flex:1}
.seg{display:flex;border:1px solid var(--bd);border-radius:var(--r-sm);overflow:hidden}
.seg button{width:2rem;height:1.9rem;display:grid;place-items:center;border:0;background:var(--bg);cursor:pointer;color:var(--muted)}
.seg button+button{border-left:1px solid var(--bd)}
.seg button.on{background:var(--faint);color:var(--fg)}
.dbody{flex:1;overflow-y:auto;padding:0 var(--s-lg) var(--s-lg);min-height:0}
.qtabs{display:flex;gap:var(--s-2xs);padding:0 var(--s-lg) var(--s-xs);flex-wrap:wrap}
.qtab{font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.04em;border:1px solid var(--bd);
  background:var(--bg);border-radius:var(--r-circle);padding:var(--s-3xs) var(--s-xs);cursor:pointer;color:var(--muted)}
.qtab.on{background:var(--heavy);border-color:var(--heavy);color:#fff}

/* reference card — screens/05 */
.ref{position:relative;background:var(--mist);border:1px solid transparent;border-radius:var(--r-md);
  padding:var(--s-sm) var(--s-md);margin-bottom:var(--s-xs);cursor:grab;transition:border-color var(--dur)}
.ref:hover{border-color:var(--bd)}
.ref.sel{border-color:var(--accent-bd);background:var(--accent-subtle)}
.ref.ghosting{opacity:.4}
.ref .top{display:flex;align-items:flex-start;gap:var(--s-xs)}
.rank{width:1.5rem;height:1.5rem;border-radius:var(--r-circle);background:var(--heavy);color:#fff;flex:none;
  display:grid;place-items:center;font-size:var(--t-2xs);font-weight:var(--w-bold)}
.rank.none{background:var(--bg);color:var(--muted);border:1px dashed var(--bd-emph)}
.ref h3{flex:1;font-size:var(--t-sm);font-weight:var(--w-bold);line-height:var(--lh-sm)}
.chk{width:1.25rem;height:1.25rem;border-radius:var(--r-xs);border:1.5px solid var(--bd-emph);flex:none;
  display:grid;place-items:center;color:transparent;background:var(--bg)}
.ref.sel .chk{background:var(--accent);border-color:var(--accent);color:#fff}
.ref .kt{font-size:var(--t-xs);line-height:var(--lh-xs);margin:var(--s-xs) 0}
.ref .kt .k{font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.06em;color:var(--muted)}
.badges{display:flex;flex-wrap:wrap;gap:var(--s-2xs);margin-bottom:var(--s-xs)}
.badge{display:inline-flex;align-items:center;gap:var(--s-2xs);font-family:var(--mono);font-size:var(--t-2xs);
  letter-spacing:.04em;color:var(--muted);border-radius:var(--r-circle);padding:var(--s-3xs) var(--s-xs)}
.badge.fill{background:var(--faint)}
.badge.rec{background:var(--accent-subtle);color:var(--accent-emph)}
.badge.kept{background:var(--pos-bg);color:var(--pos)}
.badge.notkept{background:var(--warn-bg);color:var(--warn)}
.ref .meta{font-size:var(--t-xs);color:var(--muted);display:flex;align-items:center;gap:var(--s-2xs);flex-wrap:wrap}
.ref .meta b{color:var(--fg)}
.ref .jr{font-size:var(--t-xs);color:var(--muted);font-style:italic;display:flex;align-items:center;gap:var(--s-2xs);margin-top:var(--s-3xs)}
.ref .pdf{position:absolute;right:var(--s-md);bottom:var(--s-sm);font-family:var(--mono);font-size:var(--t-2xs);
  color:var(--muted);display:flex;align-items:center;gap:var(--s-2xs)}
.empty{text-align:center;color:var(--muted);font-size:var(--t-xs);line-height:var(--lh-sm);padding:var(--s-3xl) var(--s-md)}

/* paper drawer — screens/03 */
.tabs{display:flex;gap:var(--s-md);padding:0 var(--s-lg);border-bottom:1px solid var(--bd);flex:none}
.tab{border:0;background:none;padding:var(--s-xs) 0 var(--s-sm);font-size:var(--t-sm);color:var(--muted);
  cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;display:flex;align-items:center;gap:var(--s-xs)}
.tab.on{color:var(--fg);font-weight:var(--w-med);border-bottom-color:var(--fg)}
.pp h2{font-size:var(--h-2xs);font-weight:var(--w-bold);line-height:var(--lh-lg);margin:var(--s-md) 0 var(--s-xs)}
.pp .by{font-size:var(--t-xs);margin-bottom:var(--s-md)}
.pp .by b{font-weight:var(--w-bold)}
.pp .by span{color:var(--muted)}
.pp .facts{display:flex;gap:var(--s-2xl);margin-bottom:var(--s-md)}
.pp .facts b{display:block;font-size:var(--t-xs);font-weight:var(--w-bold)}
.pp .facts span{font-size:var(--t-2xs);color:var(--muted);display:flex;align-items:center;gap:var(--s-2xs)}
.dots4{display:flex;gap:2px}
.dots4 i{width:.4rem;height:.4rem;border-radius:var(--r-circle);background:var(--green)}
.dots4 i.off{background:var(--subtle)}
.pp .doi{display:flex;align-items:center;gap:var(--s-xs);font-size:var(--t-2xs);color:var(--muted);margin-bottom:var(--s-md)}
.pp .doi b{font-family:var(--mono);color:var(--fg)}
.pp .abs{font-size:var(--t-xs);line-height:var(--lh-sm)}
.pbar{display:flex;align-items:center;gap:var(--s-xs);padding:var(--s-sm) var(--s-lg);border-top:1px solid var(--bd);flex:none}
.pbar .sp{flex:1}
.quotepill{position:absolute;right:var(--s-lg);bottom:4.5rem;display:inline-flex;align-items:center;gap:var(--s-xs);
  background:var(--bg);border:1px solid var(--bd);border-radius:var(--r-circle);padding:var(--s-xs) var(--s-sm);
  box-shadow:var(--elev-pop);font-size:var(--t-xs);cursor:pointer}

/* WHY THIS PAPER — the block that carries the whole argument.
   It appears in two places, deliberately: on the reference hover card, and as
   the head of the paper drawer's Evidence tab, which is where the product
   already keeps per-query evidence. */
.why{border:1px solid var(--accent-bd);background:var(--accent-subtle);border-radius:var(--r-sm);
  padding:var(--s-sm);margin:var(--s-sm) 0}
.why .k{display:block;font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.08em;
  color:var(--accent-emph);margin-bottom:var(--s-2xs)}
.why q{display:block;font-size:var(--t-xs);line-height:var(--lh-sm);quotes:'“' '”'}
.why .tag{display:block;font-size:var(--t-2xs);color:var(--muted);margin-top:var(--s-xs);line-height:var(--lh-2xs)}

/* hover card */
#whyCard{position:fixed;z-index:60;width:23rem;max-width:calc(100vw - 1rem);background:var(--bg);
  border:1px solid var(--bd);border-radius:var(--r-md);box-shadow:var(--elev-pop);padding:var(--s-md);
  display:none;max-height:80vh;overflow-y:auto}
#whyCard.on{display:block}
#whyCard h4{font-size:var(--t-sm);font-weight:var(--w-bold);line-height:var(--lh-sm)}
#whyCard .meta{font-size:var(--t-2xs);color:var(--muted);margin:var(--s-2xs) 0 var(--s-xs)}
#whyCard .ab{font-size:var(--t-xs);line-height:var(--lh-sm);color:var(--fg)}
#whyCard .rowacts{display:flex;gap:var(--s-xs);margin-top:var(--s-sm);padding-top:var(--s-sm);border-top:1px solid var(--bd)}
.miss{margin-top:var(--s-xs)}
.miss .open{border:0;background:none;font-size:var(--t-xs);color:var(--muted);cursor:pointer;
  text-decoration:underline;text-underline-offset:2px;padding:0}
.miss .open:hover{color:var(--fg)}
.goals,.sug{display:none;margin-top:var(--s-xs)}
.goals.on,.sug.on{display:block}
.goals .lab,.sug .lab{display:block;font-size:var(--t-2xs);color:var(--muted);margin-bottom:var(--s-2xs)}
.goal{display:block;width:100%;text-align:left;border:1px solid var(--bd);background:var(--bg);
  border-radius:var(--r-sm);padding:var(--s-xs) var(--s-sm);font-size:var(--t-xs);cursor:pointer;margin-bottom:var(--s-2xs)}
.goal:hover{border-color:var(--accent-bd);background:var(--accent-subtle)}
.sug input{width:100%;border:1px solid var(--bd);border-radius:var(--r-sm);padding:var(--s-xs) var(--s-sm);
  font-size:var(--t-xs);outline:0;margin-bottom:var(--s-xs)}
.sug input:focus{border-color:var(--accent)}
.sug .two{display:flex;gap:var(--s-2xs);flex-wrap:wrap}
.sug .keep{display:block;font-size:var(--t-2xs);color:var(--muted);margin-top:var(--s-xs)}
.mini{display:inline-flex;align-items:center;gap:var(--s-2xs);border:1px solid var(--bd);background:var(--bg);
  border-radius:var(--r-sm);padding:var(--s-2xs) var(--s-xs);font-size:var(--t-xs);cursor:pointer;white-space:nowrap}
.mini:hover{border-color:var(--bd-emph)}
.mini.pri{background:var(--accent);border-color:var(--btn-primary-bd);color:#fff}

/* ── notes drawer ────────────────────────────────────────────────────── */
.chips{display:flex;flex-wrap:wrap;gap:var(--s-2xs);padding:0 var(--s-lg) var(--s-xs);align-items:center}
.chips:empty{display:none}
.chip{display:inline-flex;align-items:center;gap:var(--s-2xs);background:var(--accent-subtle);
  color:var(--accent-emph);border:1px solid var(--accent-bd);border-radius:var(--r-circle);
  padding:var(--s-3xs) var(--s-xs);font-size:var(--t-2xs);cursor:pointer}
.chips .shown{font-size:var(--t-2xs);color:var(--muted);margin-left:auto}
.ncomp{margin:0 var(--s-lg) var(--s-sm);border:1px solid var(--bd);border-radius:var(--r-md);padding:var(--s-xs) var(--s-sm);
  transition:border-color var(--dur)}
.ncomp:focus-within{border-color:var(--accent)}
.ncomp textarea{width:100%;border:0;outline:0;resize:none;font-size:var(--t-xs);line-height:var(--lh-sm);
  overflow:hidden;background:none}
.ncomp textarea::placeholder{color:var(--placeholder)}
.ncomp .pins{margin-top:var(--s-2xs)}
.card{position:relative;border:1px solid var(--bd);border-radius:var(--r-md);padding:var(--s-sm);
  margin-bottom:var(--s-xs);background:var(--bg);cursor:grab}
.card.hidden{display:none}
.card.dragging{opacity:.4}
.card.merge{border-color:var(--accent);background:var(--accent-subtle)}
.card.land{animation:land .42s ease}
.card.flash{animation:flash 1s ease}
@keyframes land{from{opacity:0;transform:translateY(-.4rem)}}
@keyframes flash{0%,100%{background:var(--bg)}30%{background:var(--accent-subtle)}}
.card textarea{width:100%;border:0;outline:0;resize:none;font-size:var(--t-xs);line-height:var(--lh-sm);
  overflow:hidden;background:none;padding-right:var(--s-lg)}
.card textarea::placeholder{color:var(--placeholder)}
.pin{display:flex;align-items:center;gap:var(--s-2xs);font-size:var(--t-2xs);color:var(--muted);
  padding:var(--s-3xs) 0}
.pin b{font-weight:var(--w-med);color:var(--fg);white-space:nowrap}
.pin .pv{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
.pin .x{cursor:pointer;color:var(--placeholder);flex:none}
.pin .x:hover{color:var(--fg)}
.cfoot{display:flex;align-items:center;gap:var(--s-2xs);flex-wrap:wrap;margin-top:var(--s-xs)}
.tag{font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.03em;border-radius:var(--r-circle);
  padding:var(--s-3xs) var(--s-xs);background:var(--faint);color:var(--muted)}
.tag.add{border:1px dashed var(--bd-emph);background:none;cursor:pointer}
.tag.add:hover{border-color:var(--accent);color:var(--accent-emph)}
.tag.coll{background:var(--pos-bg);color:var(--pos);display:inline-flex;align-items:center;gap:var(--s-3xs)}
.grip{margin-left:auto;font-size:var(--t-2xs);color:var(--placeholder);display:flex;align-items:center;gap:var(--s-3xs)}
.cardmore{position:absolute;top:var(--s-2xs);right:var(--s-2xs);width:1.5rem;height:1.5rem;border:0;background:none;
  border-radius:var(--r-xs);color:var(--muted);cursor:pointer;opacity:0;display:grid;place-items:center}
.card:hover .cardmore{opacity:1}
.cardmore:hover{background:var(--faint);color:var(--fg)}
.tail{border:1px dashed var(--bd-emph);border-radius:var(--r-md);padding:var(--s-lg);text-align:center;
  font-size:var(--t-xs);color:var(--muted);white-space:pre-line;line-height:var(--lh-sm)}
.tail.quiet{display:none}
.tail.over{border-color:var(--accent);background:var(--accent-subtle);color:var(--accent-emph)}
.dropline{height:2px;background:var(--accent);border-radius:2px;margin:var(--s-2xs) 0}
.hint{font-size:var(--t-2xs);color:var(--muted);line-height:var(--lh-2xs);padding:var(--s-xs) 0 0}

/* ── my library ──────────────────────────────────────────────────────── */
#libScreen{grid-template-columns:1fr;overflow:hidden}
.lib{display:flex;flex-direction:column;min-height:0}
.libhd{display:flex;align-items:center;gap:var(--s-xs);padding:var(--s-lg) var(--s-xl) var(--s-md)}
.libhd h1{font-size:var(--h-xs);font-weight:var(--w-bold);display:flex;align-items:center;gap:var(--s-xs)}
.libhd h1 .crumb{color:var(--muted);cursor:pointer}
.libhd h1 .crumb:hover{color:var(--fg)}
.libhd .sp{flex:1}
.pill.blue{background:var(--accent);border-color:var(--btn-primary-bd);color:#fff}
.libtabs{display:flex;gap:var(--s-xl);padding:0 var(--s-xl);border-bottom:1px solid var(--bd);flex:none}
.libsearch{display:flex;align-items:center;gap:var(--s-xs);padding:var(--s-md) var(--s-xl)}
.libsearch .box{display:flex;align-items:center;gap:var(--s-xs);flex:1;max-width:31rem;height:2.5rem;
  border:1px solid var(--bd);border-radius:var(--r-circle);padding:0 var(--s-md);color:var(--placeholder)}
.libsearch .box input{border:0;outline:0;flex:1;font-size:var(--t-sm);background:none}
.libbody{flex:1;overflow-y:auto;padding:0 var(--s-xl) 8rem;min-height:0}
.tbl{width:100%;border-collapse:collapse}
.tbl th{text-align:left;font-size:var(--t-xs);font-weight:var(--w-bold);color:var(--fg);
  padding:var(--s-sm);border-bottom:1px solid var(--bd)}
.tbl td{font-size:var(--t-xs);padding:var(--s-sm);border-bottom:1px solid var(--bd);vertical-align:top}
.tbl td.ti{font-weight:var(--w-bold)}
.tbl td .sub{color:var(--muted);font-weight:var(--w-reg);margin-top:var(--s-3xs);display:block}
.tbl tr.pick{cursor:pointer}
.tbl tr.pick:hover td{background:var(--mist)}
.tbl .cw{width:2.5rem}
.tbl .type{display:flex;align-items:center;gap:var(--s-2xs);color:var(--fg)}
.gchk{width:1.15rem;height:1.15rem;border-radius:var(--r-xs);border:1.5px solid var(--bd-emph);
  display:grid;place-items:center;color:transparent;cursor:pointer;background:var(--bg)}
.gchk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.selbar{position:absolute;left:50%;bottom:var(--s-2xl);transform:translateX(-50%) translateY(1rem);
  display:none;align-items:center;gap:var(--s-sm);background:var(--bg);border:1px solid var(--bd);
  border-radius:var(--r-circle);box-shadow:var(--elev-pop);padding:var(--s-xs) var(--s-xs) var(--s-xs) var(--s-md);
  opacity:0;transition:opacity var(--dur),transform var(--dur);z-index:20}
.selbar.on{display:flex;opacity:1;transform:translateX(-50%)}
.selbar .n{font-size:var(--t-sm);white-space:nowrap}
.selbar input{border:0;outline:0;font-size:var(--t-sm);background:none;width:17rem}
.selbar input::placeholder{color:var(--placeholder)}
.selbar .div{width:1px;height:1.5rem;background:var(--bd)}
.noteview{max-width:46rem}
.noteview .back{border:0;background:none;font-size:var(--t-xs);color:var(--muted);cursor:pointer;
  padding:var(--s-xs) 0;display:flex;align-items:center;gap:var(--s-2xs)}
.noteview .back:hover{color:var(--fg)}
.noteview h2{font-size:var(--h-2xs);font-weight:var(--w-bold);margin:var(--s-xs) 0 var(--s-2xs)}
.noteview .sub{font-size:var(--t-xs);color:var(--muted);margin-bottom:var(--s-md)}

/* comparison — one generator, so it reads the same wherever it lands */
.cmp .join{border:1px solid var(--accent-bd);background:var(--accent-subtle);border-radius:var(--r-sm);
  padding:var(--s-sm);margin-bottom:var(--s-sm)}
.cmp .join .k{font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.08em;color:var(--accent-emph);
  display:block;margin-bottom:var(--s-2xs)}
.cmp .join p{font-size:var(--t-xs);line-height:var(--lh-sm);margin:0}
.cmp .blk{margin-bottom:var(--s-sm)}
.cmp .blk .hd{font-size:var(--t-xs);color:var(--muted);margin-bottom:var(--s-2xs)}
.cmp .blk .hd b{color:var(--fg);font-weight:var(--w-med)}
.cmp .blk q{display:block;font-size:var(--t-sm);line-height:var(--lh-sm);border-left:2px solid var(--bd-emph);
  padding-left:var(--s-sm)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s-xs);margin:var(--s-sm) 0}
.grid2 .col{border:1px solid var(--bd);border-radius:var(--r-sm);padding:var(--s-sm)}
.grid2 .k{font-family:var(--mono);font-size:var(--t-2xs);letter-spacing:.08em;color:var(--muted)}
.grid2 h4{font-size:var(--t-xs);font-weight:var(--w-bold);margin:var(--s-3xs) 0 var(--s-2xs)}
.grid2 ul{list-style:none;font-size:var(--t-2xs);color:var(--muted);line-height:var(--lh-xs)}
.grid2 ul b{color:var(--fg);font-weight:var(--w-med)}
.gapline{font-size:var(--t-2xs);color:var(--muted);border-top:1px solid var(--bd);padding-top:var(--s-xs)}

/* ── popovers, toast, ghost ──────────────────────────────────────────── */
.pop{position:fixed;z-index:70;min-width:18.75rem;max-width:21.88rem;background:var(--bg);
  border:1px solid var(--bd);border-radius:var(--r-md);box-shadow:var(--elev-pop);padding:var(--s-xs);
  display:none;max-height:24rem;overflow-y:auto}
.pop.on{display:block}
.pop button{display:flex;align-items:center;gap:var(--s-xs);width:100%;text-align:left;border:0;background:none;
  border-radius:var(--r-sm);padding:var(--s-xs);font-size:var(--t-xs);cursor:pointer}
.pop button:hover{background:var(--faint)}
.pop button .grow{flex:1;min-width:0}
.pop button .grow b{display:block;font-weight:var(--w-med);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pop button .grow span{font-size:var(--t-2xs);color:var(--muted)}
.pop input{width:100%;border:1px solid var(--bd);border-radius:var(--r-sm);padding:var(--s-xs) var(--s-sm);
  font-size:var(--t-xs);outline:0;margin:var(--s-2xs) 0}
.pop input:focus{border-color:var(--accent)}
.pop .lab{font-size:var(--t-2xs);color:var(--muted);padding:var(--s-xs) var(--s-xs) var(--s-2xs);line-height:var(--lh-2xs)}
.pop .sep{height:1px;background:var(--bd);margin:var(--s-2xs) 0}
#toast{position:fixed;left:50%;bottom:8rem;transform:translateX(-50%) translateY(1rem);z-index:90;
  background:var(--heavy);color:#fff;border-radius:var(--r-md);padding:var(--s-xs) var(--s-sm);
  font-size:var(--t-xs);max-width:21.88rem;display:flex;align-items:center;gap:var(--s-sm);
  opacity:0;pointer-events:none;transition:opacity var(--dur),transform var(--dur)}
#toast.on{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast .tact{border:0;background:#ffffff26;color:#fff;border-radius:var(--r-xs);padding:var(--s-3xs) var(--s-xs);
  font-size:var(--t-2xs);cursor:pointer;white-space:nowrap}
#ghost{position:fixed;top:-100px;left:-100px;background:var(--heavy);color:#fff;border-radius:var(--r-sm);
  padding:var(--s-2xs) var(--s-xs);font-size:var(--t-2xs);white-space:nowrap}
.tip{position:fixed;z-index:95;background:var(--heavy);color:#fff;border-radius:var(--r-sm);
  padding:var(--s-2xs) var(--s-xs);font-size:var(--t-2xs);max-width:15.63rem;line-height:var(--lh-2xs);display:none}
.tip.on{display:block}
body.dragging .ref,body.dragging .card{cursor:grabbing}
</style>
</head>
<body>

<div class="app">
  <!-- ═══ sidebar ═══════════════════════════════════════════════════════ -->
  <aside class="sb">
    <div class="brand">
      <span class="logo"></span>
      <span class="ic"><button id="sbNewColl" title="New collection" style="display:none"></button>
      <button title="Collapse sidebar"></button></span>
    </div>

    <div id="sbThread">
      <button class="nav" id="navNew"><span class="ring"></span><span class="grow">New Thread</span></button>
      <button class="nav" id="navHome"><span class="grow">Home</span></button>
      <button class="nav" id="navLib"><span class="grow">My Library</span></button>
      <button class="nav"><span class="grow">History</span></button>
      <div class="lab">Recents</div>
      <div id="recents"></div>
      <div class="lab">Tools</div>
      <button class="nav recent"><span class="grow">Paper search</span></button>
      <button class="nav recent"><span class="grow">Citation Graph</span></button>
    </div>

    <div id="sbLib" style="display:none">
      <button class="nav" id="backHome"><span class="grow">Back Home</span></button>
      <button class="nav on"><span class="grow">My Library</span></button>
      <div class="lab">Collections</div>
      <div id="tree"></div>
    </div>

    <div class="scroll"></div>
    <div class="foot">
      <button class="zot" id="zotBtn" style="display:none"><b>Z</b> Zotero Import</button>
      <button class="nav recent"><span class="grow">Learn</span><span class="ext"></span></button>
      <button class="nav recent"><span class="grow">Contact</span><span class="ext"></span></button>
      <div class="acct"><span class="av">t</span><span class="grow" style="font-size:var(--t-xs)">the</span><span style="color:var(--muted)"></span></div>
      <div class="quota"><span class="dot"></span>4 / 15 Pro messages left</div>
      <button class="upg">Upgrade</button>
    </div>
  </aside>

  <!-- ═══ stage ═════════════════════════════════════════════════════════ -->
  <div class="stage">

    <!-- ── thread ──────────────────────────────────────────────────────── -->
    <section class="screen on" id="threadScreen">
      <div class="mid">
        <header class="thd">
          <span class="ttl" id="threadName">CRISPR Off Target Effects</span>
          <span class="cnt" id="threadCount">0</span>
          <button class="ghostbtn" id="thChev" title="Thread options"></button>
          <span class="sp"></span>
          <button class="ghostbtn" title="Save thread"></button>
          <button class="ghostbtn" title="Thread settings"></button>
          <button class="pill" id="btnNotes" title="Notes for this thread"><span class="lb">Notes</span><span id="btnNotesN" style="color:var(--muted)"></span></button>
          <button class="pill" id="btnRefs" title="References"><span class="lb">References</span></button>
          <button class="pill tint" id="btnShare" title="Share"><span class="lb">Share</span></button>
        </header>

        <div class="body" id="body"><div class="inner" id="thread"></div></div>

        <div class="comp-wrap">
          <div class="comp" id="comp">
            <div id="compAtt"></div>
            <div class="row1">
              <input class="ask" id="askInput" placeholder="Ask a research question…" autocomplete="off">
              <span class="tabhint">TAB →</span>
            </div>
            <div class="row2">
              <button class="circ" id="btnPlus" title="Attach"></button>
              <button class="pill sm" id="btnCorpus">Corpus</button>
              <button class="pill sm dashed" id="btnDeep"><span class="deep"></span>Deep +</button>
              <button class="pill sm" id="inclNotes"></button>
              <span class="grow"></span>
              <button class="circ ghost" id="seedBtn" title="Fill the next question in this walkthrough"></button>
              <button class="circ ghost" title="Dictate"></button>
              <button class="circ send" id="sendBtn" title="Send"></button>
            </div>
          </div>
        </div>
      </div>

      <!-- ── notes: its own column, to the left of the drawer ──────────── -->
      <aside class="notespane" id="notesPane">
        <header class="dhd">
          <span class="t">Notes</span>

}

function renderThread(){
  const host=$('thread'); host.innerHTML='';
  $('threadCount').textContent=QUERIES.length||'';
  if(!QUERIES.length){
    host.innerHTML='<div class="blank"><b>'+esc($('threadName').textContent)+'</b>'+
      '<span>Ask something, and the papers that answered it appear on the right.<br>'+
      'The <kbd>✨</kbd> in the composer fills the next question for this walkthrough.</span></div>';
    return;
  }
  QUERIES.forEach(q=>{
    const t=el('div','turn');

      a.querySelector('span').textContent=q.att;qd.appendChild(a)}
    qd.appendChild(document.createTextNode(q.q));
    t.appendChild(qd);

    else if(q.funnel) t.appendChild(traceBlock(q));

    q.paras.forEach(p=>a.appendChild(el('p',null,fillCites(esc(p)))));
    if(q.table){a.appendChild(el('h3',null,'')).textContent='Evidence Coverage Across Key Open Questions';
      a.appendChild(evTable(q.table))}

function runSearch(text,pool){
  const q=text.toLowerCase();
  const cand=(pool||P.map((_,i)=>i));
  const scored=cand.map(i=>({i,s:P[i].k.reduce((a,k)=>a+(q.includes(k)?3:0),0)
    +P[i].t.toLowerCase().split(/\W+/).filter(w=>w.length>4&&q.includes(w)).length}));
  let hits=scored.filter(x=>x.s>0).sort((a,b)=>b.s-a.s);
  if(hits.length<3){const rest=scored.filter(x=>!hits.some(h=>h.i===x.i));
    hits=hits.concat(rest).slice(0,Math.min(4,cand.length))}
  return hits.map((h,k)=>({p:h.i,rank:k+1}));
}
function submit(){
  const text=$('askInput').value.trim(); if(!text) return;
  const scoped=!!attached;
  $('askInput').value=''; $('sendBtn').disabled=true;
  if(!QUERIES.length) $('thread').innerHTML='';
  const t=el('div','turn','<div class="q"></div><div class="thinking">'+
    (scoped?'reading your '+attached.length+' sources':'searching 32.8M papers')+
    ' <i></i><i></i><i></i></div>');
  t.querySelector('.q').textContent=text;
  $('thread').appendChild(t); $('body').scrollTop=$('body').scrollHeight;
  setTimeout(()=>{
    $('sendBtn').disabled=false;
    if(text===SCRIPT[scriptAt]) scriptAt=Math.min(scriptAt+1,SCRIPT.length-1);
    /* the first question is the captured one, so it returns the captured answer */
    if(!scoped && text===SCRIPT[0] && !QUERIES.some(q=>q.real)){
      QUERIES.push(JSON.parse(JSON.stringify(Q0)));
      activeQ=QUERIES.length-1; freshSet=new Set();
      t.remove(); setMode('refs'); renderThread(); render(); return;
    }
    const pool=scoped?attached:null;
    const refs=runSearch(text,pool);
    const top=refs.slice(0,3).map(r=>r.p);
    /* A scoped answer can still point at something you did not keep. If it does,
       that paper has to appear in this turn's references — otherwise the answer
       names a paper the panel cannot show, and the one move it invites is
       impossible. It carries no rank, because it was not retrieved for you. */
    let raised=null;
    if(scoped){
      const kept=noteSrcs();
      const seen=[...new Set(QUERIES.flatMap(q=>q.refs.map(r=>r.p)))];
      raised=seen.find(i=>!kept.includes(i));
      if(raised!=null) refs.push({p:raised,rank:null,raised:true});
    }
    const q={q:text,title:text.charAt(0).toUpperCase()+text.slice(1).replace(/\?+$/,''),refs,scoped,
      att:scoped?(attached.length+' sources from your note'):null,paras:[]};
    if(scoped){
      q.scopedText='Answered inside your note · '+pool.length+' sources · '+
        (inclNotes?'your own notes included':'sources only')+
        (filtered()?' · filtered by '+filterLabel():'')+' · nothing new retrieved';
      q.paras=['Working only from what you kept: '+
        refs.filter(r=>!r.raised).map(r=>'[['+r.p+']]').join(', ')+'.'];
      if(raised!=null) q.paras.push('Nothing outside your note was retrieved. But the closest paper '+
        'in this thread that you have not kept is [['+raised+']] — it is in your references, and not '+
        'in your note.');
      clearAttach();
    } else {
      q.plainFunnel='Keyword-matched over 6 captured papers · '+refs.length+' included';
      q.paras=['The strongest evidence here comes from [['+top[0]+']]'+
        (top[1]!=null?' and [['+top[1]+']]':'')+'.',
        top[2]!=null?'[['+top[2]+']] came back lower and is worth checking before you rely on it.':''].filter(Boolean);
      const before=new Set(QUERIES.flatMap(x=>x.refs.map(r=>r.p)));
      freshSet=new Set(refs.map(r=>r.p).filter(i=>!before.has(i)));
      activeQ=QUERIES.length;
    }
    QUERIES.push(q);
    t.remove();
    if(scoped){freshSet=new Set(raised!=null?[raised]:[]); activeQ=QUERIES.length-1}
    setMode('refs'); renderThread(); render();
  },700);
}

function renderRefs(){
  const qt=$('qtabs'); qt.innerHTML='';
  if(!QUERIES.length){
    $('refN').textContent='0';
    $('refs').innerHTML='<div class="empty">Ask something and the papers<br>that answered it appear here.</div>';
    return;
  }
  QUERIES.forEach((q,i)=>{const b=el('button','qtab'+(activeQ===i?' on':''));
    b.textContent='Q'+(i+1)+' · '+q.refs.length; b.title=q.q;
    b.addEventListener('click',()=>{activeQ=i;setMode('refs')});qt.appendChild(b)});
  const union=[...new Set(QUERIES.flatMap(q=>q.refs.map(r=>r.p)))];
  const all=el('button','qtab'+(activeQ==='all'?' on':''));
  all.textContent='ALL CITED · '+union.length;
  all.addEventListener('click',()=>{activeQ='all';setMode('refs')}); qt.appendChild(all);

  const list=activeQ==='all'
    ? union.map(p=>({p})).sort((a,b)=>recurrence(b.p)-recurrence(a.p))
    : QUERIES[activeQ].refs;
  $('refN').textContent=list.length;
  const host=$('refs'); host.innerHTML='';
  const kept=noteSrcs();
  list.forEach(({p:i,rank,raised})=>{
    const p=P[i], x=provOf(i);
    const d=el('div','ref'+(selRef.has(i)?' sel':'')); d.dataset.p=i; d.draggable=true;
    d.innerHTML='<div class="top"><span class="rank'+(rank==null?' none':'')+'"></span>'+
        '<h3></h3><span class="chk">'+svg('check',13)+'</span></div>'+
      '<div class="kt"><span class="k">KEY TAKEAWAY</span> · <span class="kv"></span></div>'+
      '<div class="badges"></div>'+
      '<div class="meta"><b></b> · <b></b> citations · <span class="au"></span></div>'+
      '<div class="jr">'+svg('doc',13)+'<span></span></div>'+
      '<span class="pdf">'+svg('lock',12)+'PDF</span>';
    d.querySelector('.rank').textContent=rank==null?'–':rank;
    d.querySelector('h3').textContent=p.t;
    d.querySelector('.kv').textContent=p.kt;
    const bg=d.querySelector('.badges');
    bg.appendChild(el('span','badge fill',svg('doc',12)+'<span></span>'))
      .querySelector('span').textContent=p.q+' SUPPORTING QUOTES';
    bg.appendChild(el('span','badge',svg('sliders',12)+'<span></span>'))
      .querySelector('span').textContent=p.type;
    /* recurrence is the one thing the real card has no room for, so it earns a
       badge of its own in the same grammar as the others */
    if(raised) bg.appendChild(el('span','badge notkept','RAISED BY THE ANSWER · NOT IN YOUR NOTE'));
    else bg.appendChild(el('span','badge rec',x.d+' '+x.r));
    if(kept.includes(i)) bg.appendChild(el('span','badge kept',svg('check',12)+'IN YOUR NOTE'));
    const m=d.querySelector('.meta').querySelectorAll('b');

    d.addEventListener('click',ev=>{
      if(ev.target.closest('.chk')){selRef.has(i)?selRef.delete(i):selRef.add(i);renderRefs();return}
      paperOn=i;pTab='overview';setMode('paper')});
    d.addEventListener('dragstart',ev=>{let g=[...selRef];if(!g.includes(i))g=[i];

    const c2=el('div',null,'<b></b><span></span>');

  if(pTab==='evidence'){

    body.insertAdjacentHTML('beforeend','<div style="height:var(--s-md)"></div>'+whyBlock(paperOn));

        '“…'+esc(p.ab.split(' ').slice(k*20,k*20+20).join(' '))+'…”</div>';
      body.appendChild(q)}
  }
  if(pTab==='snapshot') body.innerHTML='<div class="empty">The snapshot is generated on open.<br>'+
    'Not part of this prototype.</div>';

    'Not part of this prototype.</div>';

/* ══ act 3 · the note ═══════════════════════════════════════════════════ */
function pinRow(i,onRem){
  const d=el('div','pin',svg('doc',12)+'<b></b><span class="pv"></span>'+
    (onRem?'<span class="x">'+svg('x',12)+'</span>':''));
  d.querySelector('b').textContent=P[i].n;
  d.querySelector('.pv').textContent=P[i].j;
  if(onRem)d.querySelector('.x').addEventListener('click',e=>{e.stopPropagation();onRem()});
  return d;
}
function drawStaged(){$('cPins').innerHTML='';
  staged.forEach(i=>$('cPins').appendChild(pinRow(i,()=>{staged=staged.filter(x=>x!==i);drawStaged()})))}
function commit(){
  const text=$('cText').value.trim();
  if(!text&&!staged.length)return;
  CARDS.unshift({id:seq++,text,srcs:staged.slice(),tags:[],coll:savedTo||''});
  staged=[];$('cText').value='';drawStaged();fit($('cText'));render();
  const e=$('noteList').firstElementChild;
  if(e){e.classList.add('land');setTimeout(()=>e.classList.remove('land'),420)}
}
$('cText').addEventListener('input',()=>fit($('cText')));
$('cText').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();commit()}});

/* Sources dragged together arrive together — one card, because you selected
   them as a set and the thought you write will be about the set. Dropping ONTO
   a card stacks into that card instead. */
function dropSources(idxs,targetId,atIndex){
  if(targetId!=null){
    const c=CARDS.find(x=>x.id===targetId);
    const added=idxs.filter(i=>!c.srcs.includes(i));
    c.srcs.push(...added); render();
    const e=$('noteList').querySelector('[data-id="'+targetId+'"]');
    if(e){e.classList.add('flash');setTimeout(()=>e.classList.remove('flash'),1000)}
    toast(added.length?'Added to this card':'Already on this card',viewNote());
    return;
  }
  const c={id:seq++,text:'',srcs:idxs.slice(),tags:[],coll:savedTo||''};
  CARDS.splice(atIndex==null?0:atIndex,0,c);
  render();
  const e=$('noteList').querySelector('[data-id="'+c.id+'"]');
  if(e){e.classList.add('land');setTimeout(()=>e.classList.remove('land'),420)}
  toast(idxs.length===1?'Added to note':idxs.length+' sources added to note',viewNote());
}
function cardUnder(y){
  for(const e of $('noteList').querySelectorAll('.card')){const r=e.getBoundingClientRect();
    /* the middle band stacks; the top and bottom thirds insert beside */
    if(y>=r.top+r.height*0.28&&y<=r.bottom-r.height*0.28) return +e.dataset.id}
  return null;
}
function indexAt(y){const els=[...$('noteList').querySelectorAll('.card')];
  for(let k=0;k<els.length;k++){const r=els[k].getBoundingClientRect();
    if(y<r.top+r.height/2) return k}
  return els.length}
$('notesBody').addEventListener('dragover',e=>{if(!drag)return;e.preventDefault();
  const id=cardUnder(e.clientY);
  $('noteList').querySelectorAll('.card').forEach(x=>x.classList.toggle('merge',+x.dataset.id===id));
  $('tail').classList.toggle('over',id==null&&!CARDS.length);
  dropline.remove();
  if(id==null&&CARDS.length){const els=[...$('noteList').querySelectorAll('.card')],at=indexAt(e.clientY);
    at>=els.length?$('noteList').appendChild(dropline):$('noteList').insertBefore(dropline,els[at])}});
$('notesBody').addEventListener('dragleave',e=>{if(!$('notesBody').contains(e.relatedTarget)){
  $('tail').classList.remove('over');dropline.remove();
  $('noteList').querySelectorAll('.merge').forEach(x=>x.classList.remove('merge'))}});
$('notesBody').addEventListener('drop',e=>{if(!drag)return;e.preventDefault();
  const id=cardUnder(e.clientY),at=indexAt(e.clientY);
  $('tail').classList.remove('over');dropline.remove();

$('comp').addEventListener('drop',e=>{
  if(dragCard!=null){e.preventDefault();e.stopPropagation();$('comp').classList.remove('over','dropok');
    const c=CARDS.find(x=>x.id===dragCard); if(c)attach(c.srcs.slice(),'this card',[c]); return}
  if(!drag)return; e.preventDefault();e.stopPropagation();$('comp').classList.remove('over');

function render(){
  const host=$('noteList'); host.innerHTML='';
  CARDS.forEach(c=>{
    const a=el('article','card'+(cardVisible(c)?'':' hidden')); a.dataset.id=c.id; a.draggable=true;
    a.addEventListener('dragstart',e=>{

    a.appendChild(ta);
    const pins=el('div','pins');
    c.srcs.forEach(i=>pins.appendChild(pinRow(i,()=>{c.srcs=c.srcs.filter(x=>x!==i);render()})));

    more.addEventListener('click',e=>{e.stopPropagation();openCardMenu(more,c)});

  const s=noteSrcs(), as=askSrcs();

  $('askN').textContent=as.length+(filtered()?' of '+s.length:'');

  $('tail').textContent=CARDS.length?'':'Nothing here yet.\nDrag references onto the Notes button, or type above.';
  $('hint').textContent=CARDS.length
    ?'Ask attaches this note as scope — sources only, and nothing new is retrieved.'
    :'Hover any reference for why it is here. Select them and drag them here to keep them.';
  syncSwitch();
  if(dmode==='refs')renderRefs();
}
function renderChips(){

/* the live note's cards are held in CARDS, so sync it back before reading */
function syncActive(){const cur=NOTES.find(n=>n.id===activeNote);
  if(cur){cur.cards=CARDS; if(savedTo)cur.coll=savedTo}}
function switchNote(id){
  syncActive(); activeNote=id;
  const nx=NOTES.find(n=>n.id===id);
  CARDS=nx.cards; savedTo=nx.coll||null;
  activeTags.clear(); query=''; render();
  toast('Now writing into the note from “'+nx.thread+'”');
}

/* ══ ask, with the note attached ════════════════════════════════════════ */
function attach(srcs,label,cards){
  if(!srcs||!srcs.length){toast('Nothing to attach');return}
  attached=srcs.slice();
  attachedCards=(cards||askCards()).filter(c=>c.text&&c.text.trim());
  inclNotes=false;
  drawAtt(label); $('askInput').focus();
}
function clearAttach(){attached=null;attachedCards=[];inclNotes=false;drawAtt()}
function drawAtt(label){
  const a=$('compAtt'); a.innerHTML='';
  if(attached){
    const c=el('div','chipatt',svg('doc',15)+'<span class="tx"><b></b><span></span></span>'+
      '<button class="x">'+svg('x',11)+'</button>');
    c.querySelector('b').textContent=attached.length+
      (attached.length===1?' paper attached':' papers attached')+(label?' · '+label:'');
    c.querySelector('.tx span').textContent=(inclNotes?'your own notes included'
      :'sources only')+(filtered()?' · filtered by '+filterLabel():'');
    c.querySelector('.x').addEventListener('click',clearAttach);
    a.appendChild(c);
  }
  const n=attachedCards.length, b=$('inclNotes');
  b.classList.toggle('show',!!attached&&n>0);
  b.classList.toggle('on',inclNotes);
  b.innerHTML=inclNotes?svg('check',15)+n+(n===1?' note included':' notes included')
                       :svg('plus',15)+'include my notes ('+n+')';
  $('askInput').placeholder=attached?'Ask inside what you kept…':'Ask a research question…';
}
$('inclNotes').addEventListener('click',()=>{inclNotes=!inclNotes;drawAtt();
  toast(inclNotes?'Your own words go in with the sources'
                 :'Sources only — what you wrote stays out of it')});

/* ══ popovers ═══════════════════════════════════════════════════════════ */
const POPS=()=>[$('collPop'),$('tagPop'),$('filterPop'),$('menu')];
const closePops=()=>POPS().forEach(p=>p.classList.remove('on'));
function place(pop,btn){closePops();
  const r=btn.getBoundingClientRect();
  pop.style.left=Math.max(8,Math.min(r.left,window.innerWidth-330))+'px';
  pop.style.top=Math.min(r.bottom+6,window.innerHeight-300)+'px';
  setTimeout(()=>pop.classList.add('on'),0)}
POPS().forEach(p=>p.addEventListener('click',e=>e.stopPropagation()));
document.addEventListener('click',closePops);

function openCardMenu(btn,c){
  const m=$('menu'); m.innerHTML='';
  const mk=(ic,label,fn)=>{const b=el('button',null,svg(ic,15)+'<span class="grow"></span>');
    b.querySelector('.grow').textContent=label;
    b.addEventListener('click',e=>{e.stopPropagation();closePops();fn()});m.appendChild(b)};
  if(c.srcs.length) mk('chat','Ask this card · '+c.srcs.length+
    (c.srcs.length===1?' source':' sources'),()=>attach(c.srcs.slice(),'this card',[c]));
  mk('tag','Tag…',()=>openTagPop(btn,c));
  mk('folder','Add to a collection',()=>$('libBtn').click());
  mk('quote','Copy citations',()=>toast(c.srcs.length+' citations copied'));
  m.insertAdjacentHTML('beforeend','<div class="sep"></div>');
  mk('x','Delete this card',()=>{CARDS=CARDS.filter(x=>x.id!==c.id);render();toast('Card deleted')});
  place(m,btn);
}
function openTagPop(btn,card){
  const pop=$('tagPop');
  const draw=()=>{const raw=pop._i.value.trim(),q=raw.toLowerCase();
    pop._l.innerHTML='';
    TAGS.filter(t=>t.toLowerCase().includes(q)).forEach(t=>{
      const on=card.tags.includes(t);
      const b=el('button',null,(on?svg('check',15):'<span style="width:15px"></span>')+
        '<span class="grow"></span>');
      b.querySelector('.grow').textContent=t;
      b.addEventListener('click',e=>{e.stopPropagation();
        card.tags=on?card.tags.filter(x=>x!==t):card.tags.concat(t);render();draw()});
      pop._l.appendChild(b)});
    pop._n.innerHTML='';
    if(raw&&!TAGS.some(t=>t.toLowerCase()===q)){
      const b=el('button',null,svg('plus',15)+'<span class="grow"></span>');
      b.querySelector('.grow').textContent='create “'+raw+'”';
      b.addEventListener('click',e=>{e.stopPropagation();TAGS.push(raw);card.tags.push(raw);
        closePops();render();toast('Tagged “'+raw+'”')});
      pop._n.appendChild(b)}};
  pop.innerHTML='';
  const i=el('input'); i.placeholder='Type a tag, or pick one…';
  const l=el('div'), sep=el('div','sep'), n=el('div');
  pop.append(i,l,sep,n); pop._i=i; pop._l=l; pop._n=n;
  i.addEventListener('input',draw);
  i.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Escape'){closePops();return}
    if(e.key!=='Enter')return;
    e.preventDefault();
    const v=i.value.trim(); if(!v)return;
    /* Enter finishes the thought — an exact tag toggles, anything else is new */
    const hit=TAGS.find(t=>t.toLowerCase()===v.toLowerCase());
    if(hit){if(!card.tags.includes(hit))card.tags.push(hit)}
    else{TAGS.push(v);card.tags.push(v)}
    closePops(); render(); toast('Tagged “'+(hit||v)+'”');
  });
  draw(); place(pop,btn); setTimeout(()=>i.focus(),10);
}
$('filterBtn').addEventListener('click',e=>{e.stopPropagation();
  const pop=$('filterPop');
  if(pop.classList.contains('on')){closePops();return}
  $('fq').value=query; drawFilter(); place(pop,e.currentTarget);
  setTimeout(()=>$('fq').focus(),10)});
function drawFilter(){
  const raw=$('fq').value.trim(), q=raw.toLowerCase();
  const list=$('fTags'); list.innerHTML='';
  const hits=TAGS.filter(t=>t.toLowerCase().includes(q));
  if(!hits.length) list.innerHTML='<div class="lab">no tag matches</div>';
  hits.forEach(t=>{const n=CARDS.filter(c=>c.tags.includes(t)).length;
    const b=el('button',null,(activeTags.has(t)?svg('check',15):'<span style="width:15px"></span>')+
      '<span class="grow"></span><span style="color:var(--muted);font-size:var(--t-2xs)"></span>');
    b.querySelector('.grow').textContent=t;
    b.lastChild.textContent=n;
    b.addEventListener('click',ev=>{ev.stopPropagation();toggleTag(t);drawFilter()});list.appendChild(b)});
  const ft=$('fText'); ft.innerHTML='';
  if(raw){const b=el('button',null,svg('search',15)+'<span class="grow"></span>');
    b.querySelector('.grow').textContent='Filter text for “'+raw+'”';
    b.addEventListener('click',ev=>{ev.stopPropagation();query=q;render();closePops()});
    ft.appendChild(b)}
  else ft.innerHTML='<div class="lab">or type any text to search this note</div>';
}
$('fq').addEventListener('input',drawFilter);
$('fq').addEventListener('keydown',e=>{e.stopPropagation();
  if(e.key==='Enter'){e.preventDefault();const q=$('fq').value.trim().toLowerCase();if(!q)return;
    const hit=TAGS.find(t=>t.toLowerCase()===q)||TAGS.filter(t=>t.toLowerCase().includes(q))[0];
    if(hit)toggleTag(hit);else{query=q;render()} closePops()}
  if(e.key==='Escape')closePops()});

  $('libSearch').style.display=coll?'':'none';
  $('libShare').style.display=coll?'':'none';

  if(!coll){
    tabs.innerHTML='';
    body.innerHTML='<table class="tbl"><thead><tr><th class="cw"></th><th>Collection</th>'+
      '<th>Notes</th><th>Sources</th><th>Updated</th></tr></thead><tbody id="ctb"></tbody></table>';
    walk(LIB,0,[]).forEach(k=>{
      const notes=NOTES.filter(n=>n.coll===k.name&&n.cards.length);
      const srcs=[...new Set(notes.flatMap(srcsOfNote))];
      const tr=el('tr','pick');
      tr.innerHTML='<td><span class="gchk"></span></td><td class="ti"></td><td></td><td></td><td>Today</td>';
      tr.children[1].innerHTML=svg('folder',15)+'<span style="vertical-align:middle;margin-left:6px"></span>';
      tr.children[1].lastChild.textContent=k.name;
      tr.children[2].textContent=notes.length; tr.children[3].textContent=srcs.length;
      tr.addEventListener('click',()=>{coll=k.name;tab='notes';selNotes.clear();renderLib()});
      $('ctb').appendChild(tr)});
    syncNoteBar(); return;
  }

  const notes=notesInColl();
  const srcs=[...new Set(notes.flatMap(srcsOfNote))];
  const cards=notes.reduce((a,n)=>a+n.cards.length,0);
  /* the product's two tabs, plus ours — same grammar, same counts */
  [['items','Items','doc',srcs.length],['threads','Threads','chat',notes.length],
   ['notes','Notes','note',cards]].forEach(([k,l,ic,n])=>{
    const b=el('button','tab'+(tab===k?' on':''),svg(ic,16)+'<span></span>');
    b.querySelector('span').textContent=l+' ('+n+')';
    b.addEventListener('click',()=>{tab=k;openNote=null;renderLib()});tabs.appendChild(b)});
  $('libQ').placeholder='Search '+tab+' in '+coll;

  if(openNote){drawNoteView(body,notes);syncNoteBar();return}
  if(!notes.length){
    body.innerHTML='<div class="empty">Nothing filed here yet.<br>'+
      'Save a note from a thread with the folder button in the Notes panel.</div>';
    syncNoteBar(); return}

  if(tab==='items'){
    body.innerHTML='<table class="tbl"><thead><tr><th class="cw"></th><th>Title</th><th>Type</th>'+
      '<th>Authors</th><th>Journal</th><th>Year</th></tr></thead><tbody id="itb"></tbody></table>';
    srcs.forEach(i=>{const p=P[i];
      const keeping=notes.filter(n=>srcsOfNote(n).includes(i));
      const tr=el('tr','pick');
      tr.innerHTML='<td><span class="gchk"></span></td><td class="ti"></td>'+
        '<td><span class="type">'+svg('search',14)+'Journal Article</span></td>'+
        '<td></td><td></td><td></td>';
      tr.children[1].innerHTML='<span></span><span class="sub"></span>';
      tr.children[1].firstChild.textContent=p.t;
      /* the Evidence tab's job, done by the note: why this is in the library */
      tr.children[1].lastChild.textContent='kept by '+keeping.length+
        (keeping.length===1?' note':' notes')+' · “'+p.passage.slice(0,72)+'…”';
      tr.children[3].textContent=p.a; tr.children[4].textContent=p.j; tr.children[5].textContent=p.y;
      tr.addEventListener('click',()=>{paperOn=i;pTab='evidence';showScreen('thread');setMode('paper')});
      $('itb').appendChild(tr)});
  }
  if(tab==='threads'){
    body.innerHTML='<table class="tbl"><thead><tr><th class="cw"></th><th>Title</th>'+
      '<th>Preview</th></tr></thead><tbody id="ttb"></tbody></table>';
    notes.forEach(n=>{const first=n.cards.find(c=>c.text);
      const tr=el('tr','pick');
      tr.innerHTML='<td><span class="gchk"></span></td><td class="ti"></td><td></td>';
      tr.children[1].textContent=n.name;
      tr.children[2].innerHTML='<span></span><span class="sub"></span>';
      tr.children[2].firstChild.textContent=first?first.text:'(sources only)';
      tr.children[2].lastChild.textContent=n.cards.length+
        (n.cards.length===1?' note card · ':' note cards · ')+srcsOfNote(n).length+' sources kept';
      tr.addEventListener('click',()=>{tab='notes';openNote=n.key;renderLib()});
      $('ttb').appendChild(tr)});
  }
  if(tab==='notes'){
    body.innerHTML='<table class="tbl"><thead><tr><th class="cw"></th><th>From</th>'+
      '<th>What you wrote</th><th>Sources</th></tr></thead><tbody id="ntb"></tbody></table>';
    notes.forEach(n=>{const s=srcsOfNote(n), first=n.cards.find(c=>c.text);
      const tr=el('tr','pick');
      tr.innerHTML='<td><span class="gchk'+(selNotes.has(n.key)?' on':'')+'">'+svg('check',12)+
        '</span></td><td class="ti"></td><td></td><td></td>';
      tr.children[1].innerHTML='<span></span><span class="sub"></span>';
      tr.children[1].firstChild.textContent=n.name;
      tr.children[1].lastChild.textContent=n.cards.length+(n.cards.length===1?' card':' cards');
      tr.children[2].textContent=first?first.text:'(sources only)';
      tr.children[3].innerHTML='<span></span><span class="sub"></span>';
      tr.children[3].firstChild.textContent=s.length;
      tr.children[3].lastChild.textContent=s.slice(0,2).map(i=>P[i].n).join(', ')+
        (s.length>2?' +'+(s.length-2):'');
      tr.querySelector('.gchk').addEventListener('click',e=>{e.stopPropagation();
        selNotes.has(n.key)?selNotes.delete(n.key):selNotes.add(n.key);renderLib()});
      tr.addEventListener('click',()=>{openNote=n.key;renderLib()});
      $('ntb').appendChild(tr)});
  }
  syncNoteBar();
}
function drawNoteView(body,notes){
  const n=notes.find(x=>x.key===openNote); if(!n){openNote=null;return renderLib()}
  const w=el('div','noteview');
  const b=el('button','back',svg('chev',14)+'<span></span>');
  b.querySelector('svg').style.transform='rotate(90deg)';
  b.querySelector('span').textContent=coll+' · Notes';
  b.addEventListener('click',()=>{openNote=null;renderLib()});
  w.appendChild(b);
  w.appendChild(el('h2',null,'')).textContent='From '+n.name;
  w.appendChild(el('div','sub','')).textContent=n.cards.length+
    (n.cards.length===1?' card · ':' cards · ')+srcsOfNote(n).length+
    ' sources · thread-scoped, so it stays with the question it came from';
  n.cards.forEach(c=>{
    const a=el('div','card'); a.style.cursor='default';
    a.appendChild(el('div',null,'')).textContent=c.text||'(sources only)';
    a.firstChild.style.cssText='font-size:var(--t-xs);line-height:var(--lh-sm)';
    const pins=el('div','pins');
    c.srcs.forEach(i=>pins.appendChild(pinRow(i,null)));
    a.appendChild(pins);
    const f=el('div','cfoot');
    (c.tags||[]).forEach(t=>{const s=el('span','tag');s.textContent=t;f.appendChild(s)});
    a.appendChild(f); w.appendChild(a)});
  body.appendChild(w);
}
function syncNoteBar(){
  if(screen!=='lib')return;
  const notes=coll?notesInColl():[];
  const picked=notes.filter(n=>selNotes.has(n.key));
  const cards=picked.reduce((a,n)=>a+n.cards.length,0);
  const srcs=[...new Set(picked.flatMap(srcsOfNote))];
  const bar=$('selbar');
  $('selN').textContent=picked.length+' selected · '+cards+' cards · '+srcs.length+
    (srcs.length===1?' source':' sources');
  $('nAsk').placeholder=picked.length>1?'Ask across these '+picked.length+' notes…':'Ask this note…';
  bar.classList.toggle('on',picked.length>0&&!openNote);
}
$('selClear').addEventListener('click',()=>{selNotes.clear();renderLib()});

/* Sending from My Library leaves My Library. Two notes become an attachment and
   the answer arrives in the thread, which is where asking happens. */
function askNotes(){
  const keys=[...selNotes]; if(!keys.length)return;
  const q=$('nAsk').value.trim()||'Where do these lines of enquiry actually disagree?';
  $('nAsk').value='';
  const notes=notesInColl().filter(n=>keys.includes(n.key));
  const srcs=[...new Set(notes.flatMap(srcsOfNote))];
  const cards=notes.reduce((a,n)=>a+n.cards.length,0);
  selNotes.clear();
  showScreen('thread');
  $('threadName').textContent=notes.map(n=>n.name).join(' + ');
  QUERIES=[{q,title:'',refs:srcs.map((p,k)=>({p,rank:k+1})),paras:[],scoped:true,
    att:notes.length+' notes · '+cards+' cards · '+srcs.length+' sources',
    scopedText:'Answered across '+notes.length+' notes · your own notes included · nothing retrieved',
    block:compareBlock(notes)}];
  activeQ=0;
  /* the two compared notes are attached to the question, not being written into —
     so the panel opens on a fresh note rather than silently picking one of them */
  const fresh={id:'n'+(NOTES.length+1),thread:$('threadName').textContent,cards:[],coll:''};
  NOTES.push(fresh); activeNote=fresh.id; CARDS=fresh.cards; savedTo=null;
  activeTags.clear(); query=''; clearAttach();
  /* the comparison gets the room; the fresh note is there when you go looking */
  showNotesPane(false);
  renderThread(); setMode('refs'); render();
  toast('Both notes are attached. Ask anything else and it stays inside them.');
}
$('nGo').addEventListener('click',askNotes);
$('nAsk').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();askNotes()}});

/* one generator, so the comparison reads the same wherever it lands */
function compareBlock(picked){
  const wrap=el('div','cmp');
  const per=picked.map(n=>({n,s:srcsOfNote(n)}));
  const all=[...new Set(per.flatMap(x=>x.s))];
  const shared=all.filter(i=>per.every(x=>x.s.includes(i)));
  wrap.appendChild(el('h2',null,'')).textContent=shared.length
    ? 'Where these lines of enquiry meet, and where they do not'
    : 'These notes share no sources at all';
  wrap.firstChild.style.cssText='font-size:var(--h-sm);font-weight:700;line-height:var(--h-base);margin-bottom:var(--s-sm)';
  if(shared.length){
    const j=el('div','join','<span class="k">THE JOIN</span><p></p>');
    j.querySelector('p').innerHTML='Both notes kept <b>'+shared.map(i=>esc(P[i].n)).join('</b> and <b>')+
      '</b>, and each leans on it for a different claim — which is why the threads were never as '+
      'separate as their titles made them look.';
    wrap.appendChild(j)}
  per.forEach((x,k)=>{
    const c=x.n.cards.find(c=>c.text&&c.text.trim());
    const d=el('div','blk','<div class="hd"></div><q></q>');
    /* an empty quote would be a lie about what the note contains */
    d.querySelector('.hd').innerHTML=(c?(k?'And in ':'You wrote, in '):'Nothing written yet in ')+
      '<b>'+esc(x.n.name)+'</b>';
    const q=d.querySelector('q');
    if(c) q.textContent=c.text;
    else{q.textContent='this note is '+x.s.length+' sources you kept and no words yet — '+
      'the comparison below is working from the papers alone'; q.style.color='var(--muted)'}
    wrap.appendChild(d)});
  const g=el('div','grid2');
  per.forEach(x=>{
    const only=x.s.filter(i=>!per.some(y=>y.n.key!==x.n.key&&y.s.includes(i)));
    const c=el('div','col','<span class="k">ONLY IN</span><h4></h4><ul></ul>');
    c.querySelector('h4').textContent=x.n.name;
    const ul=c.querySelector('ul');
    only.forEach(i=>{const li=el('li',null,'<b></b> — '+esc(P[i].j));
      li.querySelector('b').textContent=P[i].n;ul.appendChild(li)});
    if(!only.length)ul.innerHTML='<li>nothing exclusive to this note</li>';
    g.appendChild(c)});
  wrap.appendChild(g);
  const missed=P.map((_,i)=>i).filter(i=>!all.includes(i));
  wrap.appendChild(el('div','gapline','')).textContent=missed.length
    ? 'In the corpus but in neither note: '+missed.map(i=>P[i].n).join(', ')+'.'
    : 'Between them these notes cover all '+P.length+' papers this thread retrieved.';
  return wrap;
}

/* ══ boot ═══════════════════════════════════════════════════════════════ */
paintChrome();
$('tail').textContent='Nothing here yet.\nDrag references onto the Notes button, or type above.';
setMode('refs'); showNotesPane(false);
renderThread(); render(); fit($('cText'));
</script>
